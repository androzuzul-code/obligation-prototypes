        <header className="h-[50px] bg-white border-b flex items-center pl-2 pr-4 shrink-0" style={{ borderColor: C.gray10 }}>
          <div className="w-[53px] flex items-center justify-center">{I.logo}</div>
          <nav className="flex items-center h-full">
            {items.map(it => (
              <button key={it}
                onClick={()=>onSection(it)}
                className={`relative h-full px-4 text-[14px] font-medium flex items-center ${section===it?'nav-active text-[#1c212b]':'text-[#43474f] hover:text-[#1c212b]'}`}>
                {it}
              </button>
            ))}
          </nav>
          <div className="ml-auto flex items-center gap-4">
            <button className="text-[#43474f] hover:text-[#1c212b]">{I.bell()}</button>
            <button className="flex items-center gap-1 text-[14px] text-[#43474f] hover:text-[#1c212b]">Company {I.chevDown({ style:{ color:'#43474f' }})}</button>
            <div className="w-px h-5 bg-[#e2e2e8]" />
            <div className="w-7 h-7 rounded-full bg-[#2e846c] text-white text-[12px] font-semibold flex items-center justify-center">U</div>
          </div>
        </header>
      );
    }

    function Sidebar({ activeView, onView, expandedSections, onToggleSection, activeType, onType }) {
      const Section = ({ id, label, children, action }) => (
        <div className="mb-1">
          <button
            onClick={()=>onToggleSection(id)}
            className="w-full px-4 py-2 flex items-center justify-between text-[12px] font-semibold uppercase tracking-wider text-[#72757b] hover:text-[#43474f]"
          >
            <span className="flex items-center gap-1">
              <span style={{ display:'inline-flex', transform: expandedSections[id]?'rotate(90deg)':'rotate(0)', transition:'transform .15s' }}>{I.chevRight()}</span>
              {label}
            </span>
            {action && <span className="text-[#43474f]" onClick={(e)=>e.stopPropagation()}>{action}</span>}
          </button>
          {expandedSections[id] && <div>{children}</div>}
        </div>
      );

      const ViewItem = ({ id, label, count, icon, level=0 }) => {
        const active = (id===activeView) || (id===activeType);
        return (
          <button
            onClick={()=> id.startsWith('t-') ? onType(id.slice(2)) : onView(id)}
            className={`group w-full pr-3 py-1.5 flex items-center justify-between text-[14px] rounded-md mx-2 ${active?'bg-[#e2efeb] text-[#1c212b] font-medium':'text-[#43474f] hover:bg-[#f1f2f5]'}`}
            style={{ paddingLeft: 12 + level*12 }}
          >
            <span className="flex items-center gap-2 min-w-0">
              {icon || <span className="w-4 h-4 inline-flex items-center justify-center text-[#9e9ea5]">{I.circle()}</span>}
              <span className="truncate">{label}</span>
            </span>
            {typeof count==='number' && <span className="text-[12px] tabular-nums text-[#72757b]">{fmt(count)}</span>}
          </button>
        );
      };

      return (
        <aside className="w-[268px] shrink-0 border-r overflow-y-auto scroll-hide bg-white pb-12 pr-4" style={{ borderColor: C.gray10 }}>
          <Section id="views" label="Views" action={<span className="w-5 h-5 inline-flex items-center justify-center rounded hover:bg-[#edeef2] text-[#43474f]">{I.plus()}</span>}>
            <ViewItem id="starred" label="Starred" count={5} icon={<span className="text-[#9e9ea5]">{I.star()}</span>} />
            {VIEWS.filter(v=>v.id!=='starred').map(v => <ViewItem key={v.id} id={v.id} label={v.label} count={v.count} />)}
          </Section>

          <Section id="types" label="Obligations by type" action={<span className="w-5 h-5 inline-flex items-center justify-center rounded hover:bg-[#edeef2] text-[#43474f]">{I.plus()}</span>}>
            {TYPES.map(t => <ViewItem key={t.id} id={'t-'+t.id} label={t.label} count={t.count} icon={<span style={{width:8,height:8,borderRadius:'50%',background:'#c9d1f5',display:'inline-block',marginLeft:2}} />} />)}
          </Section>

          <Section id="myviews" label="My views">
            <ViewItem id="my-fy26" label="FY26 Sales obligations" />
            <ViewItem id="my-emea" label="EMEA renewals" />
            <ViewItem id="my-vendor" label="Vendor obligations FY27" />
          </Section>
        </aside>
      );
    }

    function ViewToggle({ value, onChange }) {
      const opts = [
        { id:'list',      label:'List',      icon:I.list },
        { id:'tree',      label:'Tree',      icon:I.tree },
        { id:'data',      label:'Data',      icon:I.grid },
        { id:'dashboard', label:'Dashboard', icon:I.dashboard },
      ];
      return (
        <div className="inline-flex items-center bg-[#f5f6f8] rounded-lg p-0.5 border" style={{ borderColor: C.gray10 }}>
          {opts.map(o => (
            <button key={o.id}
              onClick={()=>onChange(o.id)}
              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[13px] font-medium ${value===o.id?'bg-white shadow-sm text-[#1c212b]':'text-[#43474f] hover:text-[#1c212b]'}`}
            >
              <span className={value===o.id?'text-[#1c212b]':'text-[#43474f]'}>{o.icon()}</span>
              {o.label}
            </button>
          ))}
        </div>
      );
    }

    function StatCard({ s, active, onClick }) {
      const dangerTones = {
        danger: { value:C.red50,    delta:'#a23e2e' },
        warn:   { value:C.yellow40, delta:'#a37116' },
        neutral:{ value:C.black90,  delta:C.black50 },
      };
      const tone = dangerTones[s.tone] || dangerTones.neutral;
      return (
        <button onClick={onClick} className={`text-left flex-1 min-w-0 rounded-xl border p-4 transition ${active?'border-[#2e846c] ring-1 ring-[#2e846c]/30 bg-white':'border-[#e2e2e8] bg-white hover:border-[#9e9ea5]'}`}>
          <div className="text-[13px] font-medium text-[#72757b] truncate">{s.label}</div>
          <div className="mt-1 text-[28px] font-display font-bold leading-tight tabular-nums" style={{ color: tone.value }}>{fmt(s.value)}</div>
          {s.delta && <div className="text-[12px] mt-0.5" style={{ color: tone.delta }}>{s.delta}</div>}
        </button>
      );
    }

    function Pill({ tone, children }) {
      return <span className="inline-flex items-center gap-1.5 px-2 h-[22px] rounded-md text-[12px] font-medium" style={{ background: tone.bg, color: tone.fg }}>
        {tone.dot && <span className="w-1.5 h-1.5 rounded-full" style={{ background: tone.dot }} />}
        {children}
      </span>;
    }

    function Avatar({ name }) {
      const ini = initials(name);
      return <span className="w-6 h-6 rounded-full text-[11px] font-semibold inline-flex items-center justify-center" style={{ background: avatarColor(name), color:'#1c212b' }}>{ini}</span>;
    }

    function ProgressBar({ p }) {
      if (!p) return <span className="text-[#9e9ea5]">—</span>;
      const pct = p.total === 0 ? 0 : Math.round((p.done / p.total) * 100);
      const done = pct === 100;
      const barColor = done ? C.green50 : pct === 0 ? C.gray40 : '#3b83f6';
      return (
        <div className="flex items-center gap-2 min-w-0">
          <div className="flex-1 min-w-[40px] h-1.5 rounded-full bg-[#e2e2e8] overflow-hidden">
            <div className="h-full rounded-full" style={{ width: `${pct}%`, background: barColor }} />
          </div>
          <span className="text-[12px] tabular-nums text-[#43474f] shrink-0">{p.done}/{p.total}</span>
        </div>
      );
    }

    const TYPE_LABELS = {
      'supplier':  'Supplier performance',
      'breach':    'Breach notice',
      'customer':  'Customer commitment',
      'rebate':    'Rebate & volume incentive',
      'ai-usage':  'AI usage',
    };

    function TriCheckbox({ state, onChange, ariaLabel }) {
      // state: 'on' | 'off' | 'partial'
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) ref.current.indeterminate = state === 'partial';
      }, [state]);
      return (
        <input
          ref={ref}
          type="checkbox"
          aria-label={ariaLabel}
          className="accent-[#2e846c] w-4 h-4"
          checked={state === 'on'}
          onChange={onChange}
          onClick={(e)=>e.stopPropagation()}
        />
      );
    }

    function ColumnPicker({ open, anchorRef, panelRef, manualCols, toggleCol, toggleSection, onClose }) {
      if (!open) return null;
      const sectionState = (cols) => {
        const count = cols.filter(c => manualCols.has(c.id)).length;
        if (count === 0) return 'off';
        if (count === cols.length) return 'on';
        return 'partial';
      };
      const Item = ({ col }) => {
        const checked = manualCols.has(col.id);
        return (
          <label className="flex items-center gap-2.5 pl-7 pr-3 py-1.5 hover:bg-[#f5f6f8] cursor-pointer rounded-md">
            <input
              type="checkbox"
              className="accent-[#2e846c] w-4 h-4"
              checked={checked}
              onChange={()=>toggleCol(col.id)}
            />
            <span className="flex-1 text-[13px] text-[#1c212b]">{col.label}</span>
          </label>
        );
      };
      const SectionHeader = ({ label, cols }) => {
        const state = sectionState(cols);
        const ids = cols.map(c => c.id);
        return (
          <label className="flex items-center gap-2.5 px-3 py-1.5 hover:bg-[#f5f6f8] cursor-pointer rounded-md">
            <TriCheckbox state={state} onChange={()=>toggleSection(ids)} ariaLabel={`Toggle all ${label} columns`} />
            <span className="text-[11px] uppercase tracking-wider text-[#72757b] font-semibold">{label}</span>
          </label>
        );
      };
      return (
        <div
          ref={panelRef}
          className="absolute z-30 bg-white border rounded-xl overflow-hidden"
          style={{
            top: 'calc(100% + 4px)',
            right: 0,
            width: 280,
            maxHeight: 460,
            borderColor: C.gray10,
            boxShadow: '0 8px 24px rgba(28,33,43,0.12)',
          }}
        >
          <div className="px-3 py-2 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
            <span className="text-[12px] font-semibold uppercase tracking-wider text-[#72757b]">Columns</span>
            <button onClick={onClose} className="text-[12px] text-[#43474f] hover:text-[#1c212b]">Done</button>
          </div>
          <div className="overflow-y-auto py-1" style={{ maxHeight: 410 }}>
            <div className="px-1 py-1">
              <SectionHeader label="Default" cols={COL_DEFS} />
              {COL_DEFS.map(c => <Item key={c.id} col={c} />)}
            </div>
            {Object.entries(TYPE_COLUMNS).map(([tid, cols]) => (
              <div key={tid} className="px-1 py-1 border-t" style={{ borderColor: C.gray10 }}>
                <SectionHeader label={TYPE_LABELS[tid] || tid} cols={cols} />
                {cols.map(c => <Item key={c.id} col={c} />)}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ObligationsTable({ rows, sort, onSort, onRowClick, selected, onToggleRow, colWidths, onResizeStart, orderedCols, columnPickerOpen, setColumnPickerOpen, columnPickerBtnRef, columnPickerRef, manualCols, toggleCol, toggleSection }) {

      const cellFor = (id, r) => {
        switch(id) {
          case 'n':        return <span className="text-[12px] text-[#72757b] tabular-nums">{r.n}</span>;
          case 'name':     return <span className="text-[13px] text-[#1c212b] font-medium block truncate">{r.name}</span>;
          case 'contract': return <span className="text-[13px] text-[#43474f] block truncate">{r.contract}</span>;
          case 'desc':     return <span className="text-[13px] text-[#43474f] block truncate" title={r.desc}>{r.desc}</span>;
          case 'status':   return <Pill tone={statusPill(r.status)}>{r.status}</Pill>;
          case 'cparty':   return <span className="text-[13px] text-[#43474f] block truncate">{r.cparty}</span>;
          case 'type':     return <span className="text-[13px] text-[#43474f] block truncate">{r.type}</span>;
          case 'resp':     return <span className="text-[13px] text-[#43474f]">{r.resp}</span>;
          case 'cadence':  return <Pill tone={cadencePill(r.cadence)}>{r.cadence}</Pill>;
          case 'due':      return <span className="text-[13px] text-[#43474f] tabular-nums whitespace-nowrap">{r.due}</span>;
          case 'created':  return <span className="text-[13px] text-[#43474f] tabular-nums">{r.created || ''}</span>;
          case 'progress': return r.cadence === 'Recurring' ? <ProgressBar p={r.progress} /> : <span className="text-[#9e9ea5]">—</span>;
          case 'assignee': return <Avatar name="Alex Avery" />;
          // Type-specific fields
          case 'freightCredit': return r.freightCredit ? <span className="text-[13px] font-medium text-[#1c5e4d] tabular-nums">{r.freightCredit}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'onTimePct':     return typeof r.onTimePct === 'number' ? (
            <div className="flex items-center gap-2 min-w-0">
              <div className="flex-1 min-w-[40px] h-1.5 rounded-full bg-[#e2e2e8] overflow-hidden">
                <div className="h-full rounded-full" style={{ width: `${r.onTimePct}%`, background: r.onTimePct >= 95 ? C.green50 : r.onTimePct >= 85 ? '#bf8519' : C.red50 }} />
              </div>
              <span className="text-[12px] tabular-nums text-[#43474f] shrink-0">{r.onTimePct}%</span>
            </div>
          ) : <span className="text-[#9e9ea5]">—</span>;
          case 'scorecard': {
            if (!r.scorecard) return <span className="text-[#9e9ea5]">—</span>;
            const grade = r.scorecard;
            const tone = grade.startsWith('A') ? { bg:C.green10, fg:C.green50 } : grade.startsWith('B') ? { bg:'#fcdfa5', fg:'#bf8519' } : { bg:C.red10, fg:C.red50 };
            return <span className="inline-flex items-center px-2 h-[22px] rounded-md text-[12px] font-semibold tabular-nums" style={{ background: tone.bg, color: tone.fg }}>{grade}</span>;
          }
          case 'aiModel': return r.aiModel ? <span className="text-[13px] text-[#1c212b] block truncate">{r.aiModel}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'aiUsage': return r.aiUsage ? <span className="text-[13px] text-[#43474f] tabular-nums">{r.aiUsage}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'aiGov': {
            if (!r.aiGov) return <span className="text-[#9e9ea5]">—</span>;
            const ok = /confirmed|approved/i.test(r.aiGov);
            const tone = ok ? { bg:C.green10, fg:C.green50 } : { bg:'#fcdfa5', fg:'#bf8519' };
            return <span className="inline-flex items-center px-2 h-[22px] rounded-md text-[12px] font-medium" style={{ background: tone.bg, color: tone.fg }}>{r.aiGov}</span>;
          }
          case 'noticeWindow': return r.noticeWindow ? <span className="text-[13px] font-medium text-[#1c212b] tabular-nums">{r.noticeWindow}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'regulator':    return r.regulator ? <span className="text-[13px] text-[#43474f] block truncate">{r.regulator}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'cascade':      return typeof r.cascade === 'number' ? <span className="text-[13px] text-[#43474f] tabular-nums">{r.cascade} affected</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'customerName': return r.customerName ? <span className="text-[13px] text-[#1c212b] block truncate">{r.customerName}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'slaTarget':    return r.slaTarget ? <span className="text-[13px] text-[#43474f]">{r.slaTarget}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'channel':      return r.channel ? <span className="text-[13px] text-[#43474f]">{r.channel}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'rebateValue':  return r.rebateValue ? <span className="text-[13px] font-medium text-[#1c5e4d] tabular-nums">{r.rebateValue}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'threshold':    return r.threshold ? <span className="text-[13px] text-[#43474f] block truncate">{r.threshold}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'achievement':  return r.achievement ? <span className="text-[13px] text-[#43474f] block truncate">{r.achievement}</span> : <span className="text-[#9e9ea5]">—</span>;
          default: return null;
        }
      };

      const Header = ({ col }) => (
        <th
          className="relative px-3 py-2.5 text-[12px] font-semibold text-[#43474f] select-none border-b text-left align-middle"
          style={{ width: colWidths[col.id], minWidth: colWidths[col.id], maxWidth: colWidths[col.id], borderColor: C.gray10, background:'#fbfbfc' }}
        >
          <button onClick={()=>onSort(col.id)} className="inline-flex items-center gap-1.5 hover:text-[#1c212b] max-w-full">
            <span className="truncate">{col.label}</span>
            {sort.col===col.id ? <span style={{ transform: sort.dir==='asc'?'rotate(180deg)':'none', display:'inline-flex' }}>{I.sortDown()}</span> : <span className="opacity-50">{I.sortDown()}</span>}
          </button>
          {/* Resize handle */}
          <div
            onMouseDown={(e)=>onResizeStart(col.id, e)}
            title="Drag to resize"
            className="absolute top-0 right-[-3px] h-full w-[6px] cursor-col-resize select-none group"
            style={{ zIndex: 2 }}
          >
            <div className="absolute top-1 bottom-1 left-1/2 -translate-x-1/2 w-px bg-transparent group-hover:bg-[#2e846c]" />
          </div>
        </th>
      );

      return (
        <div className="border rounded-xl bg-white overflow-hidden" style={{ borderColor: C.gray10 }}>
          <div className="overflow-x-auto">
            <table className="border-collapse" style={{ tableLayout: 'fixed', width: 'max-content' }}>
              <thead>
                <tr>
                  <th className="w-9 px-3 py-2.5 border-b" style={{ borderColor: C.gray10, background:'#fbfbfc' }}>
                    <input type="checkbox" className="accent-[#2e846c]" onChange={()=>{}} checked={false} />
                  </th>
                  {orderedCols.map(col => <Header key={col.id} col={col} />)}
                  {/* "+" header that opens the column picker */}
                  <th
                    className="px-2 py-2.5 border-b text-left relative"
                    style={{ width: 44, minWidth: 44, borderColor: C.gray10, background:'#fbfbfc' }}
                  >
                    <button
                      ref={columnPickerBtnRef}
                      onClick={()=>setColumnPickerOpen(o=>!o)}
                      aria-label="Add column"
                      title="Add or remove columns"
                      className={`w-7 h-7 inline-flex items-center justify-center rounded-md border ${columnPickerOpen ? 'bg-[#1c212b] text-white border-[#1c212b]' : 'bg-white text-[#43474f] hover:bg-[#f5f6f8]'}`}
                      style={!columnPickerOpen ? { borderColor: C.gray10 } : {}}
                    >
                      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
                    </button>
                    <ColumnPicker
                      open={columnPickerOpen}
                      panelRef={columnPickerRef}
                      anchorRef={columnPickerBtnRef}
                      manualCols={manualCols}
                      toggleCol={toggleCol}
                      toggleSection={toggleSection}
                      onClose={()=>setColumnPickerOpen(false)}
                    />
                  </th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.n} className="row-hover cursor-pointer" onClick={()=>onRowClick(r)}>
                    <td className="px-3 py-3 border-b align-middle" style={{ borderColor: C.gray10 }}>
                      <input type="checkbox" className="accent-[#2e846c]" checked={selected.has(r.n)} onClick={e=>e.stopPropagation()} onChange={()=>onToggleRow(r.n)} />
                    </td>
                    {orderedCols.map(col => (
                      <td
                        key={col.id}
                        className="px-3 py-3 border-b align-middle"
                        style={{ width: colWidths[col.id], minWidth: colWidths[col.id], maxWidth: colWidths[col.id], borderColor: C.gray10, overflow:'hidden' }}
                      >
                        {cellFor(col.id, r)}
                      </td>
                    ))}
                    <td className="px-2 py-3 border-b align-middle" style={{ width: 44, minWidth: 44, borderColor: C.gray10 }} />
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function DetailDrawer({ row, onClose }) {
      if (!row) return null;
      return (
        <div className="fixed inset-0 z-50 flex">
          <div className="flex-1 bg-black/20" onClick={onClose} />
          <div className="w-[520px] bg-white shadow-xl flex flex-col">
            <div className="px-6 py-4 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
              <div>
                <div className="text-[12px] text-[#72757b]">Obligation #{row.n}</div>
                <div className="text-[18px] font-display font-semibold mt-0.5">{row.name}</div>
              </div>
              <button onClick={onClose} className="text-[#43474f] hover:text-[#1c212b]" aria-label="close">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              </button>
            </div>
            <div className="p-6 overflow-y-auto space-y-5">
              <Field label="Status"><Pill tone={statusPill(row.status)}>{row.status}</Pill></Field>
              <Field label="Description"><p className="text-[14px] text-[#1c212b]">{row.desc}</p></Field>
              <div className="grid grid-cols-2 gap-5">
                <Field label="Contract">{row.contract}</Field>
                <Field label="Counterparty">{row.cparty}</Field>
                <Field label="Type">{row.type}</Field>
                <Field label="Responsibility">{row.resp}</Field>
                <Field label="Cadence"><Pill tone={cadencePill(row.cadence)}>{row.cadence}</Pill></Field>
                <Field label="Next / Due">{row.due}</Field>
              </div>
              <Field label="Assignee">
                <div className="inline-flex items-center gap-2"><Avatar name="Alex Avery" /><span className="text-[14px] text-[#1c212b]">Alex Avery</span></div>
              </Field>
            </div>
            <div className="mt-auto px-6 py-4 border-t flex items-center gap-2" style={{ borderColor: C.gray10 }}>
              <button className="px-3 h-9 rounded-md bg-[#2e846c] text-white text-[13px] font-medium hover:opacity-90">Mark fulfilled</button>
              <button className="px-3 h-9 rounded-md border text-[13px] font-medium hover:bg-[#f5f6f8]" style={{ borderColor: C.gray10 }}>Reassign</button>
              <button className="ml-auto text-[#43474f] hover:text-[#1c212b]">{I.dots3()}</button>
            </div>
          </div>
        </div>
      );
    }
    function Field({ label, children }) {
      return (
        <div>
          <div className="text-[11px] uppercase tracking-wider text-[#72757b] font-semibold mb-1.5">{label}</div>
          <div className="text-[14px] text-[#1c212b]">{children}</div>
        </div>
      );
    }

    /* ---------- App ---------- */
    const FILTER_CHIPS = ['All filters', 'Counterparty', 'Stage', 'Type', 'People', 'Date'];

    function App() {
      const [section, setSection] = useState('Obligations');
      const [activeView, setActiveView] = useState('all');
      const [activeType, setActiveType] = useState(null);
      const [expanded, setExpanded] = useState({ views:true, types:true, myviews:false });
      const [view, setView] = useState('list');
      const [statusFilter, setStatusFilter] = useState(null);
      const [search, setSearch] = useState('');
      const [sort, setSort] = useState({ col:'n', dir:'asc' });
      const [selected, setSelected] = useState(new Set());
      const [openRow, setOpenRow] = useState(null);
      const [filtersOpen, setFiltersOpen] = useState(false);
      const [activeChip, setActiveChip] = useState(null);
      const [typePopoverOpen, setTypePopoverOpen] = useState(false);
      const [selectedTypes, setSelectedTypes] = useState(new Set());
      const typeChipRef = useRef(null);
      const typePopoverRef = useRef(null);

      // Column widths (resizable) — covers base + every type-specific column
      const [colWidths, setColWidths] = useState(() => {
        const all = [...COL_DEFS, ...Object.values(TYPE_COLUMNS).flat()];
        return Object.fromEntries(all.map(c => [c.id, c.w]));
      });

      // Visible columns — single source of truth. Defaults to all base columns.
      // When activeType changes we auto-include that type's columns and remove
      // any other type's columns. User can toggle any column on/off via the
      // "+" header dropdown.
      const [manualCols, setManualCols] = useState(() => new Set(COL_DEFS.map(c => c.id)));
      const [columnPickerOpen, setColumnPickerOpen] = useState(false);
      const columnPickerBtnRef = useRef(null);
      const columnPickerRef = useRef(null);

      // All type-column IDs across every category — used to clear stale ones
      const allTypeColIds = useMemo(() =>
        new Set(Object.values(TYPE_COLUMNS).flat().map(c => c.id)),
      []);

      useEffect(() => {
        setManualCols(prev => {
          const next = new Set(prev);
          for (const id of allTypeColIds) next.delete(id);
          if (activeType && TYPE_COLUMNS[activeType]) {
            for (const c of TYPE_COLUMNS[activeType]) next.add(c.id);
          }
          return next;
        });
      }, [activeType]);

      // Outside-click for column picker
      useEffect(() => {
        if (!columnPickerOpen) return;
        const onDoc = (e) => {
          if (columnPickerRef.current && columnPickerRef.current.contains(e.target)) return;
          if (columnPickerBtnRef.current && columnPickerBtnRef.current.contains(e.target)) return;
          setColumnPickerOpen(false);
        };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [columnPickerOpen]);

      const toggleCol = useCallback((id) => {
        setManualCols(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      }, []);

      // Bulk add/remove an entire group of column ids
      const toggleSection = useCallback((ids) => {
        setManualCols(s => {
          const n = new Set(s);
          const allOn = ids.every(id => n.has(id));
          for (const id of ids) {
            if (allOn) n.delete(id);
            else n.add(id);
          }
          return n;
        });
      }, []);

      // Map id → col def, used for ordering and rendering
      const allColsMap = useMemo(() => {
        const m = new Map();
        for (const c of COL_DEFS) m.set(c.id, c);
        for (const cols of Object.values(TYPE_COLUMNS)) for (const c of cols) m.set(c.id, c);
        return m;
      }, []);

      // Render order: base order first, then type cols grouped by category order
      const orderedCols = useMemo(() => {
        const out = [];
        for (const c of COL_DEFS) if (manualCols.has(c.id)) out.push(c);
        for (const cols of Object.values(TYPE_COLUMNS)) {
          for (const c of cols) if (manualCols.has(c.id)) out.push(c);
        }
        return out;
      }, [manualCols]);
      const resizingRef = useRef(null);
      const onResizeStart = useCallback((colId, e) => {
        e.preventDefault(); e.stopPropagation();
        resizingRef.current = { colId, startX: e.clientX, startW: colWidths[colId] };
        const onMove = (ev) => {
          const r = resizingRef.current; if (!r) return;
          const delta = ev.clientX - r.startX;
          const next = Math.max(60, r.startW + delta);
          setColWidths(w => ({ ...w, [r.colId]: next }));
        };
        const onUp = () => {
          resizingRef.current = null;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      }, [colWidths]);

      // Outside-click for Type popover
      useEffect(() => {
        if (!typePopoverOpen) return;
        const onDoc = (e) => {
          if (typePopoverRef.current && typePopoverRef.current.contains(e.target)) return;
          if (typeChipRef.current && typeChipRef.current.contains(e.target)) return;
          setTypePopoverOpen(false);
        };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [typePopoverOpen]);

      const toggleSidebarSection = (id) => setExpanded(s => ({ ...s, [id]: !s[id] }));
      const onView = (id) => { setActiveView(id); setActiveType(null); };
      const onType = (id) => { setActiveType(id); setActiveView(null); };

      const filtered = useMemo(() => {
        let rs = ROWS;
        if (statusFilter === 'missed') rs = rs.filter(r => r.status === 'Missed' || r.status === 'Overdue');
        if (statusFilter === 'risk')   rs = rs.filter(r => r.status === 'At risk');
        if (statusFilter === 'internal') rs = rs.filter(r => r.resp === 'Internal');
        if (statusFilter === 'cparty')   rs = rs.filter(r => r.resp === 'Counterparty');
        if (activeView === 'overdue') rs = rs.filter(r => r.status === 'Overdue' || r.status === 'Missed');
        if (activeView === 'upcoming') rs = rs.filter(r => r.status !== 'Fulfilled');
        if (activeView === 'executed') rs = rs.filter(r => r.status === 'Fulfilled');
        if (activeView === 'needs-verification') rs = rs.filter(r => r.status === 'At risk');
        if (activeType) rs = rs.filter(r => (r.categories || []).includes(activeType));
        if (selectedTypes.size > 0) rs = rs.filter(r => selectedTypes.has(r.type));
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          rs = rs.filter(r => [r.name,r.contract,r.desc,r.cparty,r.type].join(' ').toLowerCase().includes(q));
        }
        const dirMul = sort.dir === 'asc' ? 1 : -1;
        return [...rs].sort((a,b) => {
          const va = a[sort.col] ?? ''; const vb = b[sort.col] ?? '';
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dirMul;
          return String(va).localeCompare(String(vb)) * dirMul;
        });
      }, [statusFilter, activeView, activeType, selectedTypes, search, sort]);

      const onSort = (col) => setSort(s => ({ col, dir: s.col===col ? (s.dir==='asc'?'desc':'asc') : 'asc' }));
      const onToggleRow = (n) => setSelected(s => { const next = new Set(s); next.has(n) ? next.delete(n) : next.add(n); return next; });

      // Aggregate tiles reflect whatever filters are active. The "self" tile
      // is computed from rows *excluding* its own status-filter so the active
      // card keeps showing the count it represents (otherwise clicking
      // "Missed" would collapse every other tile to 0).
      const statusBar = useMemo(() => {
        const baseFilter = (rs) => {
          if (activeView === 'overdue') rs = rs.filter(r => r.status === 'Overdue' || r.status === 'Missed');
          if (activeView === 'upcoming') rs = rs.filter(r => r.status !== 'Fulfilled');
          if (activeView === 'executed') rs = rs.filter(r => r.status === 'Fulfilled');
          if (activeView === 'needs-verification') rs = rs.filter(r => r.status === 'At risk');
          if (activeType) rs = rs.filter(r => (r.categories || []).includes(activeType));
          if (selectedTypes.size > 0) rs = rs.filter(r => selectedTypes.has(r.type));
          if (search.trim()) {
            const q = search.trim().toLowerCase();
            rs = rs.filter(r => [r.name,r.contract,r.desc,r.cparty,r.type].join(' ').toLowerCase().includes(q));
          }
          return rs;
        };
        const base = baseFilter(ROWS);
        return STATUS_BAR_DEFS.map(d => ({
          id: d.id,
          label: d.label,
          tone: d.tone,
          value: base.filter(d.match).length,
          delta: '',
        }));
      }, [activeView, activeType, selectedTypes, search]);

      return (
        <div className="h-full flex flex-col bg-white">
          <TopNav section={section} onSection={setSection} />
          <div className="flex flex-1 overflow-hidden">
            <Sidebar
              activeView={activeView}
              onView={onView}
              expandedSections={expanded}
              onToggleSection={toggleSidebarSection}
              activeType={activeType}
              onType={onType}
            />
            <main className="flex-1 flex flex-col overflow-hidden">
              {/* Title row */}
              <div className="px-6 pt-5 flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-3">
                    <h1 className="font-display font-bold text-[28px] leading-tight text-[#0e1116]">All obligations</h1>
                    <button className="text-[#9e9ea5] hover:text-[#43474f]">{I.dots3()}</button>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <ViewToggle value={view} onChange={setView} />
                  <button className="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg bg-[#2e846c] text-white text-[13px] font-medium hover:opacity-90">
                    {I.plus({ style:{ color:'white' }})}
                    New
                  </button>
                </div>
              </div>

              {/* Filter row — expands when "Filters" is clicked */}
              <div className="px-6 mt-4">
                <div
                  className="rounded-2xl border bg-white transition-all"
                  style={{ borderColor: C.gray10, boxShadow: filtersOpen ? '0 1px 2px rgba(28,33,43,0.04)' : 'none' }}
                >
                  <div className="flex items-center gap-2 px-4 min-h-12 py-2 flex-wrap">
                    <span className="text-[#72757b] shrink-0">{I.search()}</span>
                    {/* Dismissable selected-type chips render inline in the search bar */}
                    {[...selectedTypes].map(t => (
                      <span
                        key={t}
                        className="inline-flex items-center gap-1.5 h-7 pl-2.5 pr-1 rounded-full bg-[#e2efeb] text-[#1c5e4d] text-[12px] font-medium"
                      >
                        Type: {t}
                        <button
                          onClick={()=>setSelectedTypes(s => { const n = new Set(s); n.delete(t); return n; })}
                          className="w-5 h-5 inline-flex items-center justify-center rounded-full hover:bg-[#c9e4dc]"
                          aria-label={`Remove ${t}`}
                        >
                          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="#1c5e4d" strokeWidth="1.5" strokeLinecap="round"/></svg>
                        </button>
                      </span>
                    ))}
                    <input
                      value={search}
                      onChange={e=>setSearch(e.target.value)}
                      placeholder={selectedTypes.size === 0 ? "Ask or search anything" : ""}
                      className="flex-1 min-w-[120px] text-[14px] outline-none placeholder:text-[#9e9ea5] bg-transparent"
                    />
                    <button
                      onClick={()=>setFiltersOpen(o=>!o)}
                      aria-pressed={filtersOpen}
                      className={`inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border text-[13px] font-medium shrink-0 ${filtersOpen ? 'bg-[#f5f6f8] text-[#1c212b]' : 'text-[#43474f] hover:bg-[#f5f6f8]'}`}
                      style={{ borderColor: C.gray10 }}
                    >
                      {I.filter()} Filters
                    </button>
                  </div>
                  {filtersOpen && (
                    <div className="px-4 pb-3 pt-1 flex items-center gap-2 flex-wrap relative">
                      {FILTER_CHIPS.map(chip => {
                        const isType = chip === 'Type';
                        const active = isType ? (typePopoverOpen || selectedTypes.size > 0) : activeChip === chip;
                        const ref = isType ? typeChipRef : null;
                        return (
                          <button
                            key={chip}
                            ref={ref}
                            onClick={()=>{
                              if (isType) { setTypePopoverOpen(o=>!o); }
                              else { setActiveChip(c => c===chip ? null : chip); }
                            }}
                            className={`inline-flex items-center gap-1.5 h-8 px-3.5 rounded-full border text-[13px] font-medium transition ${active ? 'bg-[#1c212b] text-white border-[#1c212b]' : 'bg-white text-[#43474f] hover:bg-[#f5f6f8]'}`}
                            style={!active ? { borderColor: C.gray10 } : {}}
                          >
                            {chip}
                            {isType && selectedTypes.size > 0 && (
                              <span className={`text-[11px] px-1.5 rounded ${active ? 'bg-white/20 text-white' : 'bg-[#e2efeb] text-[#2e846c]'} font-semibold`}>
                                {selectedTypes.size}
                              </span>
                            )}
                            {isType && (
                              <span className={active ? 'text-white' : 'text-[#43474f]'}>{I.chevDown()}</span>
                            )}
                          </button>
                        );
                      })}

                      {/* Type popover */}
                      {typePopoverOpen && (
                        <div
                          ref={typePopoverRef}
                          className="absolute z-30 bg-white border rounded-xl shadow-lg overflow-hidden"
                          style={{
                            top: 'calc(100% + 6px)',
                            left: (typeChipRef.current ? typeChipRef.current.offsetLeft : 240),
                            width: 280,
                            borderColor: C.gray10,
                            boxShadow: '0 8px 24px rgba(28,33,43,0.12)',
                          }}
                        >
                          <div className="px-3 py-2 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
                            <span className="text-[12px] font-semibold uppercase tracking-wider text-[#72757b]">Filter by type</span>
                            {selectedTypes.size > 0 && (
                              <button
                                onClick={()=>setSelectedTypes(new Set())}
                                className="text-[12px] text-[#2e846c] hover:underline font-medium"
                              >Clear</button>
                            )}
                          </div>
                          <div className="max-h-[280px] overflow-y-auto py-1">
                            {ALL_TYPES.map(t => {
                              const checked = selectedTypes.has(t);
                              const count = ROWS.filter(r => r.type === t).length;
                              return (
                                <label
                                  key={t}
                                  className="flex items-center gap-2.5 px-3 py-2 hover:bg-[#f5f6f8] cursor-pointer"
                                >
                                  <input
                                    type="checkbox"
                                    className="accent-[#2e846c] w-4 h-4"
                                    checked={checked}
                                    onChange={()=>setSelectedTypes(s => {
                                      const n = new Set(s);
                                      n.has(t) ? n.delete(t) : n.add(t);
                                      return n;
                                    })}
                                  />
                                  <span className="flex-1 text-[13px] text-[#1c212b]">{t}</span>
                                  <span className="text-[12px] tabular-nums text-[#72757b]">{count}</span>
                                </label>
                              );
                            })}
                          </div>
                          <div className="px-3 py-2 border-t bg-[#fafbfc] flex items-center justify-between" style={{ borderColor: C.gray10 }}>
                            <span className="text-[12px] text-[#72757b]">{selectedTypes.size} selected</span>
                            <button
                              onClick={()=>setTypePopoverOpen(false)}
                              className="px-2.5 h-7 rounded-md bg-[#2e846c] text-white text-[12px] font-medium hover:opacity-90"
                            >Done</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* Status cards — counts recompute from the active filter set */}
              <div className="px-6 mt-4 flex gap-3 overflow-x-auto scroll-hide">
                {statusBar.map(s => (
                  <StatCard
                    key={s.id}
                    s={s}
                    active={statusFilter === s.id}
                    onClick={() => setStatusFilter(p => p===s.id ? null : s.id)}
                  />
                ))}
              </div>

              {/* Table */}
              <div className="px-6 mt-4 pb-8 flex-1 overflow-auto">
                {(statusFilter || (activeView && activeView !== 'all') || activeType || activeChip || search.trim()) && (
                  <div className="mb-2 text-[12px] text-[#72757b]">
                    Showing <span className="font-medium text-[#1c212b]">{filtered.length}</span> of {ROWS.length} obligations
                    {statusFilter && <> · filtered by <button onClick={()=>setStatusFilter(null)} className="text-[#2e846c] hover:underline">{STATUS_BAR_DEFS.find(s=>s.id===statusFilter)?.label}</button></>}
                    {activeView && activeView !== 'all' && <> · view <span className="font-medium text-[#1c212b]">{VIEWS.find(v=>v.id===activeView)?.label}</span></>}
                    {activeType && <> · type <span className="font-medium text-[#1c212b]">{TYPES.find(t=>t.id===activeType)?.label}</span></>}
                    {activeChip && <> · chip <button onClick={()=>setActiveChip(null)} className="text-[#2e846c] hover:underline">{activeChip}</button></>}
                  </div>
                )}
                <ObligationsTable
                  rows={filtered}
                  sort={sort}
                  onSort={onSort}
                  selected={selected}
                  onToggleRow={onToggleRow}
                  onRowClick={setOpenRow}
                  colWidths={colWidths}
                  onResizeStart={onResizeStart}
                  orderedCols={orderedCols}
                  columnPickerOpen={columnPickerOpen}
                  setColumnPickerOpen={setColumnPickerOpen}
                  columnPickerBtnRef={columnPickerBtnRef}
                  columnPickerRef={columnPickerRef}
                  manualCols={manualCols}
                  toggleCol={toggleCol}
                  toggleSection={toggleSection}
                />
              </div>
            </main>
          </div>
          <DetailDrawer row={openRow} onClose={()=>setOpenRow(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
