<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Vendor test</title>
  <script src="vendor/tailwindcss.js"></script>
  <script src="vendor/react.js"></script>
  <script src="vendor/react-dom.js"></script>
  <script src="vendor/babel.js"></script>
  <script type="text/babel" data-presets="react">
    function App() {
      const [n, setN] = React.useState(0);
      return (
        <div className="p-8 text-2xl">
          ✅ Setup works. Counter: {n}{' '}
          <button onClick={() => setN(n + 1)} className="ml-2 px-3 py-1 bg-emerald-700 text-white rounded">
            +1
          </button>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</head>
<body>
  <div id="root">If you see this and nothing else, the scripts didn't run.</div>
</body>
</html>
