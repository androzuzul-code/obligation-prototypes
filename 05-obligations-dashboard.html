      return (
        <div className="inline-flex items-center bg-[#f5f6f8] rounded-lg p-0.5 border" style={{ borderColor: C.gray10 }}>
          {opts.map(o => (
            <button key={o.id}
              onClick={()=>onChange(o.id)}
              className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md text-[13px] font-medium ${value===o.id?'bg-white shadow-sm text-[#1c212b]':'text-[#43474f] hover:text-[#1c212b]'}`}
            >
              <span className={value===o.id?'text-[#1c212b]':'text-[#43474f]'}>{o.icon()}</span>
              {o.label}
            </button>
          ))}
        </div>
      );
    }

    function StatCard({ s, active, onClick }) {
      const dangerTones = {
        danger: { value:C.red50,    delta:'#a23e2e' },
        warn:   { value:C.yellow40, delta:'#a37116' },
        neutral:{ value:C.black90,  delta:C.black50 },
      };
      const tone = dangerTones[s.tone] || dangerTones.neutral;
      return (
        <button onClick={onClick} className={`text-left flex-1 min-w-0 rounded-xl border p-4 transition ${active?'border-[#2e846c] ring-1 ring-[#2e846c]/30 bg-white':'border-[#e2e2e8] bg-white hover:border-[#9e9ea5]'}`}>
          <div className="text-[13px] font-medium text-[#72757b] truncate">{s.label}</div>
          <div className="mt-1 text-[28px] font-display font-bold leading-tight tabular-nums" style={{ color: tone.value }}>{fmt(s.value)}</div>
          {s.delta && <div className="text-[12px] mt-0.5" style={{ color: tone.delta }}>{s.delta}</div>}
        </button>
      );
    }

    function Pill({ tone, children }) {
      return <span className="inline-flex items-center px-2 h-[22px] rounded-[4px] text-[12px] font-medium" style={{ background: tone.bg, color: tone.fg }}>
        {children}
      </span>;
    }

    function Avatar({ name }) {
      const ini = initials(name);
      return <span className="w-6 h-6 rounded-full text-[11px] font-semibold inline-flex items-center justify-center" style={{ background: avatarColor(name), color:'#1c212b' }}>{ini}</span>;
    }

    function ProgressBar({ p }) {
      if (!p) return <span className="text-[#9e9ea5]">—</span>;
      const pct = p.total === 0 ? 0 : Math.round((p.done / p.total) * 100);
      const done = pct === 100;
      const barColor = done ? C.green50 : pct === 0 ? C.gray40 : '#3b83f6';
      return (
        <div className="flex items-center gap-2 min-w-0">
          <div className="flex-1 min-w-[40px] h-1.5 rounded-full bg-[#e2e2e8] overflow-hidden">
            <div className="h-full rounded-full" style={{ width: `${pct}%`, background: barColor }} />
          </div>
          <span className="text-[12px] tabular-nums text-[#43474f] shrink-0">{p.done}/{p.total}</span>
        </div>
      );
    }

    const TYPE_LABELS = {
      'supplier':  'Supplier performance',
      'breach':    'Breach notice',
      'customer':  'Customer commitment',
      'rebate':    'Rebate & volume incentive',
      'ai-usage':  'AI usage',
    };
    // Map the row.type value the popover lists → the TYPE_COLUMNS key
    const TYPE_VALUE_TO_KEY = {
      'Supplier performance': 'supplier',
      'Breach notice':        'breach',
      'Customer commitment':  'customer',
      'Rebate':               'rebate',
      'AI usage':             'ai-usage',
    };
    // When a type is chosen, these base columns are kept; everything else
    // (except the type-specific ones) is hidden so the table feels focused.
    const BASE_KEEP_ON_NARROW = new Set(['n','name','contract','status','cparty','cadence','due','assignee']);

    /* ---------- Source snippets (per column) ----------
     * Match the Forms 2.0 Figma "Source Card" pattern. Each template returns:
     *   - doc:   the source document name (used as bold heading)
     *   - quote: the surrounding clause / value passage
     *   - date:  extraction date string
     */
    const fakeContractId = (r) => `IC-${(r.n + 9200).toString()}`;
    const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fakeExtractedDate = (r) => {
      const m = (r.n * 7) % 12;
      const d = ((r.n * 13) % 27) + 1;
      return `${monthShort[m]} ${d}, 2026`;
    };
    const fakeDocName = (r) => `${r.contract}.pdf`;
    const sectionRef = (r, n) => `Section ${n}`;

    /* SOURCE_TEMPLATES returns: { rationale, doc, quote, valueFmt? }
     *   - rationale: WHY the AI picked this value (top of card)
     *   - doc:       source document name (used inside the grey block heading line — small grey)
     *   - quote:     the surrounding clause/value passage
     *   - valueFmt:  optional pretty-printed current value (for the Edit dialog)
     */
    const SOURCE_TEMPLATES = {
      n:        (r) => ({ rationale: `Auto-assigned at extraction. The Intake Agent sequences obligations as they're discovered in document order so the index is stable across re-runs.`, doc: fakeDocName(r), quote: `Obligation index OB-${(r.n * 31 + 1042).toString().padStart(6,'0')} — auto-assigned at extraction (sequence #${r.n}).` }),
      name:     (r) => ({ rationale: `The Intake Agent took the obligation's heading from ${sectionRef(r, '4.2')}, which the document explicitly labels as the obligation name. Where there was no heading, the agent derived a short title from the first sentence of the clause.`, doc: fakeDocName(r), quote: `"${r.name} — ${r.desc.split('.')[0]}." (${sectionRef(r, '4.2')} — Obligation Heading)` }),
      contract: (r) => ({ rationale: `Linked to the parent agreement that originated the obligation. The agent matched the document hash to the executed contract record in the repository (${fakeContractId(r)}).`, doc: fakeDocName(r), quote: `Parent agreement: ${r.contract} (${fakeContractId(r)}). Executed Mar 14, 2024 with ${r.cparty}. Filed under the Master Services Agreement family.` }),
      desc:     (r) => ({ rationale: `Pulled verbatim from the source clause. The agent preserves the original sentence so reviewers can verify against the document without paraphrasing risk.`, doc: fakeDocName(r), quote: `"${r.desc}" (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}`)})` }),
      status:   (r) => ({ rationale: r.status === 'Fulfilled'
                            ? `All required instances of this recurring obligation were marked complete before the cycle close, so the agent rolled the parent status to Fulfilled.`
                            : r.status === 'Missed' || r.status === 'Overdue'
                              ? `The deadline at ${r.due} passed with no corresponding action logged. The agent escalated to ${r.status} once the contractual cure window closed.`
                              : r.status === 'At risk'
                                ? `The 30-day rolling performance window is failing the threshold defined in the source clause, so the agent flagged this as At risk to surface it before it tips into Missed.`
                                : `The agent is tracking ${r.progress ? r.progress.done : 0} of ${r.progress ? r.progress.total : 1} required instances complete. Status stays In-progress until the cycle closes or a hard deadline is hit.`,
                          doc: fakeDocName(r), quote: r.status === 'Fulfilled'
                                                                ? `Status marked Fulfilled — all ${r.progress?.total || 1} required instances completed by ${r.due}.`
                                                                : r.status === 'Missed' || r.status === 'Overdue'
                                                                  ? `Status ${r.status} — required action not recorded before ${r.due}; cure window has lapsed.`
                                                                  : r.status === 'At risk'
                                                                    ? `Status At risk — current performance is trending below the threshold defined in the source clause; rolling 30-day window is failing.`
                                                                    : `Status In-progress — ${r.progress ? r.progress.done : 0} of ${r.progress ? r.progress.total : 1} required instances complete; next instance due ${r.due}.` }),
      cparty:   (r) => ({ rationale: `The agent matched the counterparty name in the contract header to a registered entity. Where the spelling varied, it fell back to the Salesforce account record (ID-${(r.n + 660000).toString()}).`, doc: fakeDocName(r), quote: `Counterparty: ${r.cparty}. Linked to Salesforce account ID-${(r.n + 660000).toString()}, located at 377 Washington Pl, San Francisco CA 94133.` }),
      type:     (r) => ({ rationale: `Classified as ${r.type} based on vocabulary in the clause matching the ${r.type.toLowerCase()} category (model v2.4.1, 94% confidence). The next-highest candidate scored below the 70% gate, so a single label was assigned.`, doc: fakeDocName(r), quote: `Classified as ${r.type} at 94% confidence. Clause vocabulary matched ${r.type.toLowerCase()} category (model v2.4.1).` }),
      resp:     (r) => ({ rationale: `The clause uses the subject "${r.resp === 'Internal' ? 'Customer' : 'Vendor'} shall be responsible for…", which the agent maps to ${r.resp} responsibility under the MSA's defined-terms list.`, doc: fakeDocName(r), quote: r.resp === 'Internal'
                                                                ? `"Customer shall be responsible for the timely performance of the obligations set forth in this Section, including any required ${r.type.toLowerCase()} actions." (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}(b)`)})`
                                                                : `"Vendor warrants and shall be responsible for the obligations set forth in this Section, including any required ${r.type.toLowerCase()} actions." (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}(b)`)})` }),
      cadence:  (r) => ({ rationale: r.cadence === 'Recurring' ? `The clause uses recurring language ("each billing cycle", "quarterly") so the agent classified the cadence as Recurring and will instantiate a new child on each cycle close.`
                            : r.cadence === 'Event based' ? `The clause is conditional on an external trigger ("upon receipt of", "in the event of"). The agent classified the cadence as Event based and will spawn a child only when that event is recorded.`
                            : r.cadence === 'Perpetual' ? `The clause carries no end date or trigger, so the agent classified the cadence as Perpetual; the obligation persists for the life of the agreement.`
                            : `The clause defines a single action with a fixed deadline. The agent classified the cadence as One-time and will close the obligation once that action is logged.`,
                          doc: fakeDocName(r), quote: r.cadence === 'Recurring' ? 'Clause specifies a recurring trigger — repeated each billing cycle.' : r.cadence === 'Event based' ? 'Clause is event-triggered — fires only when the defined external event occurs.' : r.cadence === 'Perpetual' ? 'No expiry; obligation persists for the duration of the agreement.' : 'One-time action; fulfilled once and closed.' }),
      due:      (r) => ({ rationale: r.cadence === 'Recurring' ? `Recurring cadence — the agent set the due date to the next cycle close (${r.due}) based on the billing-period definition in the MSA.`
                            : r.cadence === 'Event based' ? `Event-based cadence — the agent will not compute a due date until the trigger event is recorded; this value represents the worst-case statutory window.`
                            : `Fixed deadline pulled verbatim from the source clause.`,
                          doc: fakeDocName(r), quote: r.cadence === 'Recurring'
                                                                ? `Next instance ${r.due}. Trigger: recurring cycle close (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}(c)`)}).`
                                                                : r.cadence === 'Event based'
                                                                  ? `Triggered on receipt of vendor event notice; window starts on receipt (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}(c)`)}).`
                                                                  : `Static deadline ${r.due} defined in source clause (${sectionRef(r, `${(r.n % 12) + 3}.${(r.n % 5) + 1}(c)`)}).` }),
      created:  (r) => ({ rationale: `Count of child instances spawned from this parent obligation since ingestion. The agent regenerates this value nightly from the obligations ledger.`, doc: fakeDocName(r), quote: `${r.created || r.progress?.total || 1} child instance(s) generated from this parent obligation since ${fakeContractId(r)} was archived.` }),
      progress: (r) => ({ rationale: (r.cadence === 'Recurring' && r.progress) ? `Computed from the obligations ledger: instances flagged Fulfilled in the current cycle window over total required instances. Re-runs on each ledger update.` : `Progress is only computed for recurring obligations; the agent skips this field otherwise.`, doc: fakeDocName(r), quote: (r.cadence === 'Recurring' && r.progress)
                                                                ? `${r.progress.done} of ${r.progress.total} required instances marked Fulfilled in the current cycle window. Progress tracking applies to recurring obligations only.`
                                                                : `Progress tracking is only applied to recurring obligations; not applicable here.` }),
      assignee: (r) => ({ rationale: `The assignment was set by Anthony King on Apr 2, 2026. The agent suggested Alex Avery based on the obligation type matching her workgroup's coverage rules.`, doc: 'Acme Workspace · Assignment ledger', quote: `Assigned to Alex Avery (Legal Ops Manager, alex.avery@acmecorp.com) by Anthony King on Apr 2, 2026.` }),

      // Type-specific columns
      freightCredit: (r) => ({ rationale: `The agent multiplied the per-unit penalty rate ($0.018) by the YTD volume shortfall recorded in the supply-chain telemetry feed. Result rounded to the nearest hundred for display.`, doc: fakeDocName(r), quote: `"Vendor shall credit Customer at the rate of $0.018 per unit short of the committed delivery forecast, applied against the next invoice." (${sectionRef(r, '7.4 — Performance Credits')}). YTD credit accrual: ${r.freightCredit}.` }),
      onTimePct:     (r) => ({ rationale: `Computed as a rolling 12-month average over ${(r.n * 13) % 240 + 80} shipments. The agent dropped two outliers flagged by the supplier as force-majeure events per the clause carve-out.`, doc: 'Procurement scorecard data', quote: `Calculated as a rolling 12-month average across ${(r.n * 13) % 240 + 80} shipments. SLA threshold per ${sectionRef(r, '6.2')} is 95%. Current measure: ${r.onTimePct}%.` }),
      scorecard:     (r) => ({ rationale: `Weighted score across on-time delivery, quality, responsiveness, and pricing variance. The agent applies the procurement team's published rubric and grades A through F at fixed thresholds.`, doc: 'Procurement scorecard data', quote: `Vendor scorecard ${r.scorecard} — weighted score across on-time, quality, responsiveness, and pricing variance. Last review: Q4 FY26.` }),
      aiModel:       (r) => ({ rationale: `Read from Schedule A of the executed enterprise MSA, which names the model offered to the customer. Schedule A is the controlling list; later amendments override only when explicitly listed.`, doc: fakeDocName(r), quote: `"Provider shall make available the ${r.aiModel} model subject to the Acceptable Use Policy in Schedule A." (Schedule A — Acceptable Use)` }),
      aiUsage:       (r) => ({ rationale: `Aggregated from platform telemetry over the last 30 calendar days. Includes both API and workspace clients; per-user breakdown available in the Insights dashboard.`, doc: 'Platform telemetry · last 30 days', quote: `Aggregated across the last 30 calendar days — includes API and workspace clients. Current value: ${r.aiUsage}.` }),
      aiGov:         (r) => ({ rationale: `Set by the compliance review on ${(r.n * 3) % 28 + 1} Feb 2026 after the data-class audit. The required mitigation comes from the company's AI governance policy, mapped to the data class affected.`, doc: fakeDocName(r), quote: `Compliance review flagged "${r.aiGov}" on ${(r.n * 3) % 28 + 1} Feb 2026. Trigger: data class includes regulated PII; required mitigation: ${/redaction/i.test(r.aiGov||'') ? 'PII redaction not yet in place' : 'review documented and active'}.` }),
      noticeWindow:  (r) => ({ rationale: `The clause names the exact window (${r.noticeWindow}). The agent normalizes any unit to ISO duration internally and renders the human-readable string here.`, doc: fakeDocName(r), quote: `"Counterparty shall notify Customer in writing within ${r.noticeWindow} of becoming aware of any incident affecting customer data." (${sectionRef(r, '9.3 — Security Incident Notification')})` }),
      regulator:     (r) => ({ rationale: `Pulled from the compliance schedule cross-referenced in the body of the DPA. Where multiple regulators are named, the most specific (smallest geographic scope) is chosen first.`, doc: fakeDocName(r), quote: `Compliance basis: ${r.regulator}. Referenced in ${r.contract} and mapped to the obligations registry.` }),
      cascade:       (r) => ({ rationale: `The agent cross-referenced your customer DPAs against the data class affected. ${r.cascade} agreement(s) carry downstream notification clauses that fire on the same trigger.`, doc: 'Customer DPA cross-reference', quote: `Cross-referenced your customer DPAs against the data class affected. ${r.cascade} agreement(s) carry downstream notification clauses triggered by this incident.` }),
      customerName:  (r) => ({ rationale: `Customer entity name is read from the contract header, then matched to a tenant record in the workspace. The agent prefers the tenant record where conflict exists.`, doc: fakeDocName(r), quote: `Customer: ${r.customerName}. Tenant ID ${(r.n + 88000).toString().padStart(6, '0')}. Account owner: A. Avery. Tier: Enterprise.` }),
      slaTarget:     (r) => ({ rationale: `The SLA target text is taken verbatim from the SLA section of the contract. Where multiple targets exist, the most stringent is selected.`, doc: fakeDocName(r), quote: `"Service Provider shall maintain ${r.slaTarget} measured monthly against the targets set forth herein." (${sectionRef(r, '2.3 — Service Level Targets')})` }),
      channel:       (r) => ({ rationale: `Anchor for traceability — the agent stores the section/clause where the obligation originated so reviewers can jump straight to it from the popover.`, doc: fakeDocName(r), quote: `Source clause anchor: ${r.channel} of ${r.contract}.` }),
      rebateValue:   (r) => ({ rationale: `Computed from invoice volume against the applicable tier in Schedule B. The agent re-runs at quarter close and reconciles against any manual adjustments in the payments ledger.`, doc: fakeDocName(r), quote: `Rebate value: ${r.rebateValue}. Calculated from invoice volume × applicable tier; reconciled at the end of each fiscal quarter per Schedule B (Volume Tiers).` }),
      threshold:     (r) => ({ rationale: `Threshold value taken from Schedule B. The agent normalizes currency and aggregation period internally; this is the rendered string only.`, doc: fakeDocName(r), quote: `"Tier shall activate once cumulative spend in the fiscal year crosses ${r.threshold}, reconciled at quarter close." (Schedule B §2)` }),
      achievement:   (r) => ({ rationale: `Year-to-date achievement is computed nightly from the payments warehouse and projected to year-end based on rolling 90-day spend.`, doc: 'Acme Payments warehouse', quote: `Year-to-date status: ${r.achievement}. Sourced from invoice data through ${(r.n * 3) % 28 + 1} Apr 2026. Updates nightly from the payments warehouse.` }),
    };

    /* Edit-mode field type per column — drives the editable widgets in the
     * card's edit state. */
    const EDIT_FIELDS = {
      n:             { kind:'readonly' },
      name:          { kind:'text',   placeholder:'Obligation name' },
      contract:      { kind:'text',   placeholder:'Parent contract' },
      desc:          { kind:'textarea', placeholder:'Source clause text' },
      status:        { kind:'select', options:['In-progress','Fulfilled','Missed','Overdue','At risk'] },
      cparty:        { kind:'text',   placeholder:'Counterparty entity' },
      type:          { kind:'select', options:()=>ALL_TYPES },
      resp:          { kind:'select', options:['Internal','Counterparty'] },
      cadence:       { kind:'select', options:['Recurring','Event based','Perpetual','One-time'] },
      due:           { kind:'date'   },
      created:       { kind:'number' },
      progress:      { kind:'progress' },
      assignee:      { kind:'text',   placeholder:'Assignee email' },
      freightCredit: { kind:'currency' },
      onTimePct:     { kind:'percent' },
      scorecard:     { kind:'select', options:['A+','A','A−','B+','B','B−','C'] },
      aiModel:       { kind:'text',   placeholder:'Model · Provider' },
      aiUsage:       { kind:'text',   placeholder:'Usage' },
      aiGov:         { kind:'select', options:['Approved','No-train confirmed','PII review required','PII redaction gap','Pending review'] },
      noticeWindow:  { kind:'select', options:['24 hr','48 hr','72 hr','7 day','14 day','30 day'] },
      regulator:     { kind:'text',   placeholder:'Regulator basis' },
      cascade:       { kind:'number' },
      customerName:  { kind:'text',   placeholder:'Customer name' },
      slaTarget:     { kind:'text',   placeholder:'SLA target' },
      channel:       { kind:'text',   placeholder:'Source clause' },
      rebateValue:   { kind:'text',   placeholder:'Rebate value' },
      threshold:     { kind:'text',   placeholder:'Threshold' },
      achievement:   { kind:'text',   placeholder:'Achievement' },
    };
    const rawCellValue = (r, colId) => {
      switch (colId) {
        case 'n': return r.n;
        case 'progress': return r.progress ? `${r.progress.done}/${r.progress.total}` : '';
        case 'created':  return r.created || '';
        default: return r[colId] ?? '';
      }
    };

    /* Data-view column grouping for the section-header row.
     * All "default" columns roll up to a single Overview category. */
    const COL_GROUPS = [
      { id:'overview', label:'Overview',                  cols:['n','name','contract','desc','status','cparty','type','resp','cadence','due','created','progress','assignee'] },
      { id:'supplier', label:'Supplier performance',     cols:['freightCredit','onTimePct','scorecard'] },
      { id:'breach',   label:'Breach notice',            cols:['noticeWindow','regulator','cascade'] },
      { id:'customer', label:'Customer commitment',      cols:['customerName','slaTarget','channel'] },
      { id:'rebate',   label:'Rebate & volume incentive',cols:['rebateValue','threshold','achievement'] },
      { id:'ai-usage', label:'AI usage',                 cols:['aiModel','aiUsage','aiGov'] },
    ];

    function TriCheckbox({ state, onChange, ariaLabel }) {
      // state: 'on' | 'off' | 'partial'
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) ref.current.indeterminate = state === 'partial';
      }, [state]);
      return (
        <input
          ref={ref}
          type="checkbox"
          aria-label={ariaLabel}
          className="accent-[#2e846c] w-4 h-4"
          checked={state === 'on'}
          onChange={onChange}
          onClick={(e)=>e.stopPropagation()}
        />
      );
    }

    function ColumnPicker({ open, anchorRef, panelRef, manualCols, toggleCol, toggleSection, onClose }) {
      if (!open) return null;
      const sectionState = (cols) => {
        const count = cols.filter(c => manualCols.has(c.id)).length;
        if (count === 0) return 'off';
        if (count === cols.length) return 'on';
        return 'partial';
      };
      const Item = ({ col }) => {
        const checked = manualCols.has(col.id);
        return (
          <label className="flex items-center gap-2.5 pl-7 pr-3 py-1.5 hover:bg-[#f5f6f8] cursor-pointer rounded-md">
            <input
              type="checkbox"
              className="accent-[#2e846c] w-4 h-4"
              checked={checked}
              onChange={()=>toggleCol(col.id)}
            />
            <span className="flex-1 text-[13px] text-[#1c212b]">{col.label}</span>
          </label>
        );
      };
      const SectionHeader = ({ label, cols }) => {
        const state = sectionState(cols);
        const ids = cols.map(c => c.id);
        return (
          <label className="flex items-center gap-2.5 px-3 py-1.5 hover:bg-[#f5f6f8] cursor-pointer rounded-md">
            <TriCheckbox state={state} onChange={()=>toggleSection(ids)} ariaLabel={`Toggle all ${label} columns`} />
            <span className="text-[11px] uppercase tracking-wider text-[#72757b] font-semibold">{label}</span>
          </label>
        );
      };
      return (
        <div
          ref={panelRef}
          className="absolute z-30 bg-white border rounded-xl overflow-hidden"
          style={{
            top: 'calc(100% + 4px)',
            right: 0,
            width: 280,
            maxHeight: 460,
            borderColor: C.gray10,
            boxShadow: '0 8px 24px rgba(28,33,43,0.12)',
          }}
        >
          <div className="px-3 py-2 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
            <span className="text-[12px] font-semibold uppercase tracking-wider text-[#72757b]">Columns</span>
            <button onClick={onClose} className="text-[12px] text-[#43474f] hover:text-[#1c212b]">Done</button>
          </div>
          <div className="overflow-y-auto py-1" style={{ maxHeight: 410 }}>
            <div className="px-1 py-1">
              <SectionHeader label="Default" cols={COL_DEFS} />
              {COL_DEFS.map(c => <Item key={c.id} col={c} />)}
            </div>
            {Object.entries(TYPE_COLUMNS).map(([tid, cols]) => (
              <div key={tid} className="px-1 py-1 border-t" style={{ borderColor: C.gray10 }}>
                <SectionHeader label={TYPE_LABELS[tid] || tid} cols={cols} />
                {cols.map(c => <Item key={c.id} col={c} />)}
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ObligationsTable({ rows, sort, onSort, onRowClick, selected, onToggleRow, colWidths, onResizeStart, orderedCols, columnPickerOpen, setColumnPickerOpen, columnPickerBtnRef, columnPickerRef, manualCols, toggleCol, toggleSection, tableView, onCellClick, activeCell, onEarClick, earMenuCell }) {

      const cellFor = (id, r) => {
        switch(id) {
          case 'n':        return <span className="text-[12px] text-[#72757b] tabular-nums">{r.n}</span>;
          case 'name':     return <EntityChip kind="obligation" label={r.name} />;
          case 'contract': return <EntityChip kind="contract" label={r.contract} />;
          case 'desc':     return <span className="text-[13px] text-[#43474f] block truncate" title={r.desc}>{r.desc}</span>;
          case 'status':   return <Pill tone={statusPill(r.status)}>{r.status}</Pill>;
          case 'cparty':   return <EntityChip kind="entity" label={r.cparty} />;
          case 'type':     return <span className="text-[13px] text-[#43474f] block truncate">{r.type}</span>;
          case 'resp':     return <span className="text-[13px] text-[#43474f]">{r.resp}</span>;
          case 'cadence':  return <Pill tone={cadencePill(r.cadence)}>{r.cadence}</Pill>;
          case 'due':      return <span className="text-[13px] text-[#43474f] tabular-nums whitespace-nowrap">{r.due}</span>;
          case 'created':  return <span className="text-[13px] text-[#43474f] tabular-nums">{r.created || ''}</span>;
          case 'progress': return r.cadence === 'Recurring' ? <ProgressBar p={r.progress} /> : <span className="text-[#9e9ea5]">—</span>;
          case 'assignee': return <Avatar name="Alex Avery" />;
          // Type-specific fields
          case 'freightCredit': return r.freightCredit ? <span className="text-[13px] font-medium text-[#1c5e4d] tabular-nums">{r.freightCredit}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'onTimePct':     return typeof r.onTimePct === 'number' ? (
            <div className="flex items-center gap-2 min-w-0">
              <div className="flex-1 min-w-[40px] h-1.5 rounded-full bg-[#e2e2e8] overflow-hidden">
                <div className="h-full rounded-full" style={{ width: `${r.onTimePct}%`, background: r.onTimePct >= 95 ? C.green50 : r.onTimePct >= 85 ? '#bf8519' : C.red50 }} />
              </div>
              <span className="text-[12px] tabular-nums text-[#43474f] shrink-0">{r.onTimePct}%</span>
            </div>
          ) : <span className="text-[#9e9ea5]">—</span>;
          case 'scorecard': {
            if (!r.scorecard) return <span className="text-[#9e9ea5]">—</span>;
            const grade = r.scorecard;
            const tone = grade.startsWith('A') ? { bg:C.green10, fg:C.green50 } : grade.startsWith('B') ? { bg:'#fcdfa5', fg:'#bf8519' } : { bg:C.red10, fg:C.red50 };
            return <span className="inline-flex items-center px-2 h-[22px] rounded-md text-[12px] font-semibold tabular-nums" style={{ background: tone.bg, color: tone.fg }}>{grade}</span>;
          }
          case 'aiModel': return r.aiModel ? <span className="text-[13px] text-[#1c212b] block truncate">{r.aiModel}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'aiUsage': return r.aiUsage ? <span className="text-[13px] text-[#43474f] tabular-nums">{r.aiUsage}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'aiGov': {
            if (!r.aiGov) return <span className="text-[#9e9ea5]">—</span>;
            const ok = /confirmed|approved/i.test(r.aiGov);
            const tone = ok ? { bg:C.green10, fg:C.green50 } : { bg:'#fcdfa5', fg:'#bf8519' };
            return <span className="inline-flex items-center px-2 h-[22px] rounded-md text-[12px] font-medium" style={{ background: tone.bg, color: tone.fg }}>{r.aiGov}</span>;
          }
          case 'noticeWindow': return r.noticeWindow ? <span className="text-[13px] font-medium text-[#1c212b] tabular-nums">{r.noticeWindow}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'regulator':    return r.regulator ? <span className="text-[13px] text-[#43474f] block truncate">{r.regulator}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'cascade':      return typeof r.cascade === 'number' ? <span className="text-[13px] text-[#43474f] tabular-nums">{r.cascade} affected</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'customerName': return r.customerName ? <span className="text-[13px] text-[#1c212b] block truncate">{r.customerName}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'slaTarget':    return r.slaTarget ? <span className="text-[13px] text-[#43474f]">{r.slaTarget}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'channel':      return r.channel ? <span className="text-[13px] text-[#43474f]">{r.channel}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'rebateValue':  return r.rebateValue ? <span className="text-[13px] font-medium text-[#1c5e4d] tabular-nums">{r.rebateValue}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'threshold':    return r.threshold ? <span className="text-[13px] text-[#43474f] block truncate">{r.threshold}</span> : <span className="text-[#9e9ea5]">—</span>;
          case 'achievement':  return r.achievement ? <span className="text-[13px] text-[#43474f] block truncate">{r.achievement}</span> : <span className="text-[#9e9ea5]">—</span>;
          default: return null;
        }
      };

      const Header = ({ col, cellBorder, isLast, dense, headerPadY }) => (
        <th
          className={`relative px-3 ${headerPadY || 'py-2.5'} text-[11px] font-semibold text-[#72757b] select-none border-b text-left align-middle`}
          style={{
            width: colWidths[col.id], minWidth: colWidths[col.id], maxWidth: colWidths[col.id],
            borderColor: C.gray10, background:'#ffffff',
            borderRight: (cellBorder && !isLast) ? cellBorder : 'none',
            height: dense ? 36 : undefined,
            textTransform: 'uppercase',
            letterSpacing: '0.06em',
          }}
        >
          <button onClick={()=>onSort(col.id)} className="inline-flex items-center gap-1.5 hover:text-[#1c212b] max-w-full">
            <span className="truncate" style={{ textTransform: 'uppercase' }}>{col.label}</span>
            {sort.col===col.id ? <span style={{ transform: sort.dir==='asc'?'rotate(180deg)':'none', display:'inline-flex' }}>{I.sortDown()}</span> : <span className="opacity-50">{I.sortDown()}</span>}
          </button>
          {/* Resize handle */}
          <div
            onMouseDown={(e)=>onResizeStart(col.id, e)}
            title="Drag to resize"
            className="absolute top-0 right-[-3px] h-full w-[6px] cursor-col-resize select-none group"
            style={{ zIndex: 2 }}
          >
            <div className="absolute top-1 bottom-1 left-1/2 -translate-x-1/2 w-px bg-transparent group-hover:bg-[#2e846c]" />
          </div>
        </th>
      );

      const dense = tableView === 'data';
      const cellPadY = dense ? 'py-2' : 'py-3';
      const headerPadY = dense ? 'py-2' : 'py-2.5';
      const cellBorder = dense ? '1px solid ' + C.gray10 : 'none';
      return (
        <div className="bg-white overflow-hidden relative border-t" style={{ borderColor: C.gray10 }}>
          <div className="overflow-x-auto">
            <table className="border-collapse" style={{ tableLayout: 'fixed', width: 'max-content' }}>
              <thead>
                {dense && (() => {
                  // Category section row — Data view only.
                  const groupOf = {};
                  for (const g of COL_GROUPS) for (const c of g.cols) groupOf[c] = g;
                  const runs = [];
                  let cur = null;
                  for (const col of orderedCols) {
                    const g = groupOf[col.id];
                    const key = g ? g.id : '__none';
                    if (cur && cur.key === key) cur.span++;
                    else { cur = { key, label: g ? g.label : '', span: 1 }; runs.push(cur); }
                  }
                  return (
                    <tr style={{ height: 32 }}>
                      <th className="border-b" style={{ borderColor: C.gray10, background: '#ffffff', borderRight: cellBorder }} />
                      {runs.map((run, i) => (
                        <th
                          key={i}
                          colSpan={run.span}
                          className="px-3 py-1.5 text-left border-b"
                          style={{
                            background: '#ffffff',
                            borderColor: C.gray10,
                            borderRight: (i < runs.length - 1) ? cellBorder : 'none',
                          }}
                        >
                          <span className="text-[11px] font-semibold text-[#72757b]" style={{ textTransform: 'uppercase', letterSpacing: '0.06em' }}>{run.label}</span>
                        </th>
                      ))}
                    </tr>
                  );
                })()}
                <tr style={dense ? { height: 36 } : null}>
                  <th className={`w-9 px-3 ${headerPadY} border-b`} style={{ borderColor: C.gray10, background:'#ffffff', borderRight: cellBorder, height: dense ? 36 : undefined }}>
                    <input type="checkbox" className="accent-[#2e846c]" onChange={()=>{}} checked={false} />
                  </th>
                  {orderedCols.map((col, idx) => <Header key={col.id} col={col} cellBorder={cellBorder} isLast={idx === orderedCols.length - 1} dense={dense} headerPadY={headerPadY} />)}
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr
                    key={r.n}
                    className={`${dense ? 'data-row' : 'row-hover'} cursor-pointer`}
                    onClick={()=>onRowClick(r)}
                    style={dense ? { height: 36 } : null}
                  >
                    <td className={`px-3 ${cellPadY} border-b align-middle`} style={{ borderColor: C.gray10, borderRight: cellBorder, height: dense ? 36 : undefined }}>
                      <input type="checkbox" className="accent-[#2e846c]" checked={selected.has(r.n)} onClick={e=>e.stopPropagation()} onChange={()=>onToggleRow(r.n)} />
                    </td>
                    {orderedCols.map((col, idx) => {
                      const isActive = dense && activeCell && activeCell.rowN === r.n && activeCell.colId === col.id;
                      const earOpen = dense && earMenuCell && earMenuCell.rowN === r.n && earMenuCell.colId === col.id;
                      return (
                        <td
                          key={col.id}
                          data-row={r.n}
                          data-col={col.id}
                          className={`px-3 ${cellPadY} border-b align-middle ${dense ? 'data-cell' : ''} ${isActive ? 'data-cell-active' : ''} ${earOpen ? 'cell-menu-open' : ''}`}
                          style={{
                            width: colWidths[col.id], minWidth: colWidths[col.id], maxWidth: colWidths[col.id],
                            borderColor: C.gray10, overflow: 'hidden',
                            borderRight: (dense && idx !== orderedCols.length - 1) ? cellBorder : 'none',
                            height: dense ? 36 : undefined,
                            lineHeight: dense ? '20px' : undefined,
                            whiteSpace: dense ? 'nowrap' : undefined,
                            textOverflow: dense ? 'ellipsis' : undefined,
                            cursor: dense ? 'pointer' : undefined,
                          }}
                          onClick={dense ? (e)=>{ e.stopPropagation(); onCellClick(r, col, e.currentTarget); } : undefined}
                        >
                          {cellFor(col.id, r)}
                          {dense && (
                            <button
                              type="button"
                              className="cell-ear"
                              aria-label="Cell actions"
                              onClick={(e)=>{ e.stopPropagation(); onEarClick(r, col, e.currentTarget); }}
                            >
                              <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                                <circle cx="6" cy="2.4" r="1" fill="#43474f"/>
                                <circle cx="6" cy="6"   r="1" fill="#43474f"/>
                                <circle cx="6" cy="9.6" r="1" fill="#43474f"/>
                              </svg>
                            </button>
                          )}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {/* Sticky "+" column picker — floats at the top-right with a
              subtle dark drop shadow (no white fade behind it). */}
          <div className="absolute top-0 right-0 z-20" style={{ pointerEvents: 'none' }}>
            <div className="flex items-center justify-end pr-3" style={{ height: 41, pointerEvents: 'auto' }}>
              <div className="relative flex items-center justify-center" style={{ height: 40 }}>
                <button
                  ref={columnPickerBtnRef}
                  onClick={()=>setColumnPickerOpen(o=>!o)}
                  aria-label="Add column"
                  title="Add or remove columns"
                  className={`w-7 h-7 inline-flex items-center justify-center rounded-md border ${columnPickerOpen ? 'bg-[#1c212b] text-white border-[#1c212b]' : 'bg-white text-[#43474f] hover:bg-[#f5f6f8]'}`}
                  style={{ borderColor: columnPickerOpen ? '#1c212b' : C.gray10, boxShadow: '0 2px 6px rgba(28,33,43,0.16), 0 1px 2px rgba(28,33,43,0.10)' }}
                >
                  <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
                </button>
                <ColumnPicker
                  open={columnPickerOpen}
                  panelRef={columnPickerRef}
                  anchorRef={columnPickerBtnRef}
                  manualCols={manualCols}
                  toggleCol={toggleCol}
                  toggleSection={toggleSection}
                  onClose={()=>setColumnPickerOpen(false)}
                />
              </div>
            </div>
          </div>
        </div>
      );
    }

    function DetailDrawer({ row, onClose }) {
      if (!row) return null;
      return (
        <div className="fixed inset-0 z-50 flex">
          <div className="flex-1 bg-black/20" onClick={onClose} />
          <div className="w-[520px] bg-white shadow-xl flex flex-col">
            <div className="px-6 py-4 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
              <div>
                <div className="text-[12px] text-[#72757b]">Obligation #{row.n}</div>
                <div className="text-[18px] font-display font-semibold mt-0.5">{row.name}</div>
              </div>
              <button onClick={onClose} className="text-[#43474f] hover:text-[#1c212b]" aria-label="close">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
              </button>
            </div>
            <div className="p-6 overflow-y-auto space-y-5">
              <Field label="Status"><Pill tone={statusPill(row.status)}>{row.status}</Pill></Field>
              <Field label="Description"><p className="text-[14px] text-[#1c212b]">{row.desc}</p></Field>
              <div className="grid grid-cols-2 gap-5">
                <Field label="Contract">{row.contract}</Field>
                <Field label="Counterparty">{row.cparty}</Field>
                <Field label="Type">{row.type}</Field>
                <Field label="Responsibility">{row.resp}</Field>
                <Field label="Cadence"><Pill tone={cadencePill(row.cadence)}>{row.cadence}</Pill></Field>
                <Field label="Next / Due">{row.due}</Field>
              </div>
              <Field label="Assignee">
                <div className="inline-flex items-center gap-2"><Avatar name="Alex Avery" /><span className="text-[14px] text-[#1c212b]">Alex Avery</span></div>
              </Field>
            </div>
            <div className="mt-auto px-6 py-4 border-t flex items-center gap-2" style={{ borderColor: C.gray10 }}>
              <button className="px-3 h-9 rounded-md bg-[#2e846c] text-white text-[13px] font-medium hover:opacity-90">Mark fulfilled</button>
              <button className="px-3 h-9 rounded-md border text-[13px] font-medium hover:bg-[#f5f6f8]" style={{ borderColor: C.gray10 }}>Reassign</button>
              <button className="ml-auto text-[#43474f] hover:text-[#1c212b]">{I.dots3()}</button>
            </div>
          </div>
        </div>
      );
    }
    function Field({ label, children }) {
      return (
        <div>
          <div className="text-[11px] uppercase tracking-wider text-[#72757b] font-semibold mb-1.5">{label}</div>
          <div className="text-[14px] text-[#1c212b]">{children}</div>
        </div>
      );
    }

    /* ---------- App ---------- */
    const FILTER_CHIPS = ['All filters', 'Counterparty', 'Stage', 'Type', 'People', 'Date'];

    function App() {
      const [section, setSection] = useState('Obligations');
      const [activeView, setActiveView] = useState('all');
      const [activeType, setActiveType] = useState(null);
      const [expanded, setExpanded] = useState({ views:true, myviews:false });
      const [view, setView] = useState('list');
      const [statusFilter, setStatusFilter] = useState(null);
      const [search, setSearch] = useState('');
      const [sort, setSort] = useState({ col:'n', dir:'asc' });
      const [selected, setSelected] = useState(new Set());
      const [openRow, setOpenRow] = useState(null);
      const [filtersOpen, setFiltersOpen] = useState(false);
      const [activeChip, setActiveChip] = useState(null);
      const [typePopoverOpen, setTypePopoverOpen] = useState(false);
      const [selectedTypes, setSelectedTypes] = useState(new Set());
      const typeChipRef = useRef(null);
      const typePopoverRef = useRef(null);

      // Column widths (resizable) — covers base + every type-specific column
      const [colWidths, setColWidths] = useState(() => {
        const all = [...COL_DEFS, ...Object.values(TYPE_COLUMNS).flat()];
        return Object.fromEntries(all.map(c => [c.id, c.w]));
      });

      // Visible columns — single source of truth. Defaults to base columns
      // only. Selecting a type via the Type filter chip popover ADDS that
      // type's specific columns on top of the base set; clearing types
      // removes the type-specific columns again.
      const [manualCols, setManualCols] = useState(() => new Set(COL_DEFS.map(c => c.id)));
      const [columnPickerOpen, setColumnPickerOpen] = useState(false);
      const columnPickerBtnRef = useRef(null);
      const columnPickerRef = useRef(null);

      useEffect(() => {
        setManualCols(prev => {
          // Always start with all base columns
          const next = new Set(COL_DEFS.map(c => c.id));
          // Append type-specific columns for each selected type
          for (const t of selectedTypes) {
            const key = TYPE_VALUE_TO_KEY[t];
            if (key && TYPE_COLUMNS[key]) {
              for (const c of TYPE_COLUMNS[key]) next.add(c.id);
            }
          }
          return next;
        });
      }, [selectedTypes]);

      // Outside-click for column picker
      useEffect(() => {
        if (!columnPickerOpen) return;
        const onDoc = (e) => {
          if (columnPickerRef.current && columnPickerRef.current.contains(e.target)) return;
          if (columnPickerBtnRef.current && columnPickerBtnRef.current.contains(e.target)) return;
          setColumnPickerOpen(false);
        };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [columnPickerOpen]);

      const toggleCol = useCallback((id) => {
        setManualCols(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
      }, []);

      // Bulk add/remove an entire group of column ids
      const toggleSection = useCallback((ids) => {
        setManualCols(s => {
          const n = new Set(s);
          const allOn = ids.every(id => n.has(id));
          for (const id of ids) {
            if (allOn) n.delete(id);
            else n.add(id);
          }
          return n;
        });
      }, []);

      // Map id → col def, used for ordering and rendering
      const allColsMap = useMemo(() => {
        const m = new Map();
        for (const c of COL_DEFS) m.set(c.id, c);
        for (const cols of Object.values(TYPE_COLUMNS)) for (const c of cols) m.set(c.id, c);
        return m;
      }, []);

      // Table view: 'list' (default style, additive columns) or 'data' (cell-based, dense, every column visible)
      const [tableView, setTableView] = useState('list');

      // Active cell source popover (Data view only)
      const [sourceCell, setSourceCell] = useState(null); // { row, col, rect }
      const onCellClick = useCallback((row, col, el) => {
        const rect = el.getBoundingClientRect();
        setSourceCell(prev => {
          if (prev && prev.row.n === row.n && prev.col.id === col.id) return null;
          return { row, col, rect };
        });
        // If the doc preview is currently open, reload it to reflect the new cell's source
        setDocPreview(prev => {
          if (!prev) return prev;
          if (prev.row.n === row.n && prev.col.id === col.id) return prev;
          const tpl = SOURCE_TEMPLATES[col.id];
          if (!tpl) return prev;
          return { row, col, data: tpl(row) };
        });
      }, []);
      const closeSource = useCallback(() => setSourceCell(null), []);

      // Cell overflow action ear (Data view only)
      const [earMenu, setEarMenu] = useState(null); // { row, col, rect }
      const onEarClick = useCallback((row, col, el) => {
        const rect = el.getBoundingClientRect();
        setEarMenu(prev => {
          if (prev && prev.row.n === row.n && prev.col.id === col.id) return null;
          return { row, col, rect };
        });
        // Close source popover if open so they don't stack visually
        setSourceCell(null);
      }, []);
      const closeEarMenu = useCallback(() => setEarMenu(null), []);
      const onEarAction = useCallback((actionId) => {
        if (!earMenu) return;
        if (actionId === 'edit') {
          // Find the cell DOM to re-anchor the source card directly
          const sc = tableScrollerRef.current;
          const cell = sc ? sc.querySelector(`[data-row="${earMenu.row.n}"][data-col="${earMenu.col.id}"]`) : null;
          const rect = cell ? cell.getBoundingClientRect() : earMenu.rect;
          setSourceCell({ row: earMenu.row, col: earMenu.col, rect, mode: 'edit' });
        } else {
          // Other actions (Copy / Accept / Delete) — log for now in this demo
          console.log('cell action', actionId, earMenu.row?.n, earMenu.col?.id);
        }
      }, [earMenu]);

      // Document preview slideout
      const [docPreview, setDocPreview] = useState(null); // { row, col, data }
      const tableScrollerRef = useRef(null);
      const onViewInDoc = useCallback((payload) => {
        setDocPreview(payload);
        // Keep the source card open so the user can still see the rationale;
        // we'll re-anchor it after layout settles in an effect below.
      }, []);
      const closeDoc = useCallback(() => setDocPreview(null), []);

      // When the doc preview opens / resizes, scroll the active cell so it
      // stays visible AND has enough room to the right for the source card,
      // so the card never overlaps the doc preview panel.
      const SOURCE_CARD_W = 460;
      const EDGE_BUFFER = 16;
      const reanchorActiveCell = useCallback(() => {
        if (!sourceCell) return;
        const sc = tableScrollerRef.current;
        if (!sc) return;
        const sel = `[data-row="${sourceCell.row.n}"][data-col="${sourceCell.col.id}"]`;
        const cell = sc.querySelector(sel);
        if (!cell) return;
        const cellRect = cell.getBoundingClientRect();
        const scRect = sc.getBoundingClientRect();
        // Right-side overflow takes into account the source card's width,
        // so cell.left + source-card-width must fit within the visible area.
        const rightLimit = scRect.right - EDGE_BUFFER;
        const desiredRight = cellRect.left + SOURCE_CARD_W;
        if (desiredRight > rightLimit) {
          sc.scrollLeft += (desiredRight - rightLimit);
        } else if (cellRect.left < scRect.left + EDGE_BUFFER) {
          sc.scrollLeft -= ((scRect.left + EDGE_BUFFER) - cellRect.left);
        }
        requestAnimationFrame(() => {
          const r = cell.getBoundingClientRect();
          setSourceCell(prev => prev ? { ...prev, rect: r } : prev);
        });
      }, [sourceCell]);

      // Fire reanchor twice: immediately (catches the layout shift the moment
      // the panel mounts as a flex sibling) AND after the slide animation
      // settles (so the final cell rect is read once everything is at rest).
      useEffect(() => {
        const ids = [
          setTimeout(reanchorActiveCell, 0),
          setTimeout(reanchorActiveCell, 240),
        ];
        return () => ids.forEach(clearTimeout);
      }, [docPreview, reanchorActiveCell]);

      const onPreviewWidthChange = useCallback(() => {
        reanchorActiveCell();
      }, [reanchorActiveCell]);

      // Render order: in Data mode, force ALL columns; otherwise honor manualCols.
      const orderedCols = useMemo(() => {
        const out = [];
        if (tableView === 'data') {
          for (const c of COL_DEFS) out.push(c);
          for (const cols of Object.values(TYPE_COLUMNS)) for (const c of cols) out.push(c);
          return out;
        }
        for (const c of COL_DEFS) if (manualCols.has(c.id)) out.push(c);
        for (const cols of Object.values(TYPE_COLUMNS)) {
          for (const c of cols) if (manualCols.has(c.id)) out.push(c);
        }
        return out;
      }, [manualCols, tableView]);
      const resizingRef = useRef(null);
      const onResizeStart = useCallback((colId, e) => {
        e.preventDefault(); e.stopPropagation();
        resizingRef.current = { colId, startX: e.clientX, startW: colWidths[colId] };
        const onMove = (ev) => {
          const r = resizingRef.current; if (!r) return;
          const delta = ev.clientX - r.startX;
          const next = Math.max(60, r.startW + delta);
          setColWidths(w => ({ ...w, [r.colId]: next }));
        };
        const onUp = () => {
          resizingRef.current = null;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      }, [colWidths]);

      // Outside-click for Type popover
      useEffect(() => {
        if (!typePopoverOpen) return;
        const onDoc = (e) => {
          if (typePopoverRef.current && typePopoverRef.current.contains(e.target)) return;
          if (typeChipRef.current && typeChipRef.current.contains(e.target)) return;
          setTypePopoverOpen(false);
        };
        document.addEventListener('mousedown', onDoc);
        return () => document.removeEventListener('mousedown', onDoc);
      }, [typePopoverOpen]);

      const toggleSidebarSection = (id) => setExpanded(s => ({ ...s, [id]: !s[id] }));
      const onView = (id) => { setActiveView(id); setActiveType(null); };
      const onType = (id) => { setActiveType(id); setActiveView(null); };

      const filtered = useMemo(() => {
        let rs = ROWS;
        if (statusFilter === 'missed') rs = rs.filter(r => r.status === 'Missed' || r.status === 'Overdue');
        if (statusFilter === 'risk')   rs = rs.filter(r => r.status === 'At risk');
        if (statusFilter === 'internal') rs = rs.filter(r => r.resp === 'Internal');
        if (statusFilter === 'cparty')   rs = rs.filter(r => r.resp === 'Counterparty');
        if (activeView === 'overdue') rs = rs.filter(r => r.status === 'Overdue' || r.status === 'Missed');
        if (activeView === 'upcoming') rs = rs.filter(r => r.status !== 'Fulfilled');
        if (activeView === 'executed') rs = rs.filter(r => r.status === 'Fulfilled');
        if (activeView === 'needs-verification') rs = rs.filter(r => r.status === 'At risk');
        if (activeType) rs = rs.filter(r => (r.categories || []).includes(activeType));
        if (selectedTypes.size > 0) rs = rs.filter(r => selectedTypes.has(r.type));
        if (search.trim()) {
          const q = search.trim().toLowerCase();
          rs = rs.filter(r => [r.name,r.contract,r.desc,r.cparty,r.type].join(' ').toLowerCase().includes(q));
        }
        const dirMul = sort.dir === 'asc' ? 1 : -1;
        return [...rs].sort((a,b) => {
          const va = a[sort.col] ?? ''; const vb = b[sort.col] ?? '';
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dirMul;
          return String(va).localeCompare(String(vb)) * dirMul;
        });
      }, [statusFilter, activeView, activeType, selectedTypes, search, sort]);

      const onSort = (col) => setSort(s => ({ col, dir: s.col===col ? (s.dir==='asc'?'desc':'asc') : 'asc' }));
      const onToggleRow = (n) => setSelected(s => { const next = new Set(s); next.has(n) ? next.delete(n) : next.add(n); return next; });

      // Aggregate tiles reflect whatever filters are active. The "self" tile
      // is computed from rows *excluding* its own status-filter so the active
      // card keeps showing the count it represents (otherwise clicking
      // "Missed" would collapse every other tile to 0).
      const statusBar = useMemo(() => {
        const baseFilter = (rs) => {
          if (activeView === 'overdue') rs = rs.filter(r => r.status === 'Overdue' || r.status === 'Missed');
          if (activeView === 'upcoming') rs = rs.filter(r => r.status !== 'Fulfilled');
          if (activeView === 'executed') rs = rs.filter(r => r.status === 'Fulfilled');
          if (activeView === 'needs-verification') rs = rs.filter(r => r.status === 'At risk');
          if (activeType) rs = rs.filter(r => (r.categories || []).includes(activeType));
          if (selectedTypes.size > 0) rs = rs.filter(r => selectedTypes.has(r.type));
          if (search.trim()) {
            const q = search.trim().toLowerCase();
            rs = rs.filter(r => [r.name,r.contract,r.desc,r.cparty,r.type].join(' ').toLowerCase().includes(q));
          }
          return rs;
        };
        const base = baseFilter(ROWS);
        return STATUS_BAR_DEFS.map(d => ({
          id: d.id,
          label: d.label,
          tone: d.tone,
          value: base.filter(d.match).length,
          delta: '',
        }));
      }, [activeView, activeType, selectedTypes, search]);

      return (
        <div className="h-full flex flex-col bg-white">
          <TopNav section={section} onSection={setSection} />
          <div className="flex flex-1 overflow-hidden">
            <Sidebar
              activeView={activeView}
              onView={onView}
              expandedSections={expanded}
              onToggleSection={toggleSidebarSection}
              activeType={activeType}
              onType={onType}
            />
            <main className="flex-1 flex flex-col overflow-hidden">
              {/* Title row */}
              <div className="px-6 pt-5 flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-3">
                    <h1 className="font-display font-bold text-[28px] leading-tight text-[#0e1116]">All obligations</h1>
                    <button className="text-[#9e9ea5] hover:text-[#43474f]">{I.dots3()}</button>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <button className="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg bg-[#2e846c] text-white text-[13px] font-medium hover:opacity-90">
                    {I.plus({ style:{ color:'white' }})}
                    New
                  </button>
                </div>
              </div>

              {/* Filter row — expands when "Filters" is clicked; ContextSwitcher to the right */}
              <div className="px-6 mt-4 flex items-start gap-3">
                <div
                  className={`${filtersOpen ? 'rounded-[24px]' : 'rounded-full'} border bg-white transition-all flex-1 min-w-0`}
                  style={{ borderColor: C.gray10, boxShadow: filtersOpen ? '0 1px 2px rgba(28,33,43,0.04)' : 'none' }}
                >
                  <div className="flex items-center gap-2 px-4 min-h-12 py-2 flex-wrap">
                    <span className="text-[#72757b] shrink-0">{I.search()}</span>
                    {/* Dismissable selected-type chips render inline in the search bar */}
                    {[...selectedTypes].map(t => (
                      <span
                        key={t}
                        className="inline-flex items-center gap-1.5 h-7 pl-2.5 pr-1 rounded-full bg-[#e2efeb] text-[#1c5e4d] text-[12px] font-medium"
                      >
                        Type: {t}
                        <button
                          onClick={()=>setSelectedTypes(s => { const n = new Set(s); n.delete(t); return n; })}
                          className="w-5 h-5 inline-flex items-center justify-center rounded-full hover:bg-[#c9e4dc]"
                          aria-label={`Remove ${t}`}
                        >
                          <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="#1c5e4d" strokeWidth="1.5" strokeLinecap="round"/></svg>
                        </button>
                      </span>
                    ))}
                    <input
                      value={search}
                      onChange={e=>setSearch(e.target.value)}
                      placeholder={selectedTypes.size === 0 ? "Ask or search anything" : ""}
                      className="flex-1 min-w-[120px] text-[14px] outline-none placeholder:text-[#9e9ea5] bg-transparent"
                    />
                    <button
                      onClick={()=>setFiltersOpen(o=>!o)}
                      aria-pressed={filtersOpen}
                      className={`inline-flex items-center gap-1.5 h-8 px-3 rounded-lg border text-[13px] font-medium shrink-0 ${filtersOpen ? 'bg-[#f5f6f8] text-[#1c212b]' : 'text-[#43474f] hover:bg-[#f5f6f8]'}`}
                      style={{ borderColor: C.gray10 }}
                    >
                      {I.filter()} Filters
                    </button>
                  </div>
                  {filtersOpen && (
                    <div className="px-4 pb-3 pt-1 flex items-center gap-2 flex-wrap relative">
                      {FILTER_CHIPS.map(chip => {
                        const isType = chip === 'Type';
                        const active = isType ? (typePopoverOpen || selectedTypes.size > 0) : activeChip === chip;
                        const ref = isType ? typeChipRef : null;
                        return (
                          <button
                            key={chip}
                            ref={ref}
                            onClick={()=>{
                              if (isType) { setTypePopoverOpen(o=>!o); }
                              else { setActiveChip(c => c===chip ? null : chip); }
                            }}
                            className={`inline-flex items-center gap-1.5 h-8 px-3.5 rounded-full border text-[13px] font-medium transition ${active ? 'bg-[#1c212b] text-white border-[#1c212b]' : 'bg-white text-[#43474f] hover:bg-[#f5f6f8]'}`}
                            style={!active ? { borderColor: C.gray10 } : {}}
                          >
                            {chip}
                            {isType && selectedTypes.size > 0 && (
                              <span className={`text-[11px] px-1.5 rounded ${active ? 'bg-white/20 text-white' : 'bg-[#e2efeb] text-[#2e846c]'} font-semibold`}>
                                {selectedTypes.size}
                              </span>
                            )}
                            {isType && (
                              <span className={active ? 'text-white' : 'text-[#43474f]'}>{I.chevDown()}</span>
                            )}
                          </button>
                        );
                      })}

                      {/* Type popover */}
                      {typePopoverOpen && (
                        <div
                          ref={typePopoverRef}
                          className="absolute z-30 bg-white border rounded-xl shadow-lg overflow-hidden"
                          style={{
                            top: 'calc(100% + 6px)',
                            left: (typeChipRef.current ? typeChipRef.current.offsetLeft : 240),
                            width: 280,
                            borderColor: C.gray10,
                            boxShadow: '0 8px 24px rgba(28,33,43,0.12)',
                          }}
                        >
                          <div className="px-3 py-2 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
                            <span className="text-[12px] font-semibold uppercase tracking-wider text-[#72757b]">Filter by type</span>
                            {selectedTypes.size > 0 && (
                              <button
                                onClick={()=>setSelectedTypes(new Set())}
                                className="text-[12px] text-[#2e846c] hover:underline font-medium"
                              >Clear</button>
                            )}
                          </div>
                          <div className="max-h-[280px] overflow-y-auto py-1">
                            {ALL_TYPES.map(t => {
                              const checked = selectedTypes.has(t);
                              const count = ROWS.filter(r => r.type === t).length;
                              return (
                                <label
                                  key={t}
                                  className="flex items-center gap-2.5 px-3 py-2 hover:bg-[#f5f6f8] cursor-pointer"
                                >
                                  <input
                                    type="checkbox"
                                    className="accent-[#2e846c] w-4 h-4"
                                    checked={checked}
                                    onChange={()=>setSelectedTypes(s => {
                                      const n = new Set(s);
                                      n.has(t) ? n.delete(t) : n.add(t);
                                      return n;
                                    })}
                                  />
                                  <span className="flex-1 text-[13px] text-[#1c212b]">{t}</span>
                                  <span className="text-[12px] tabular-nums text-[#72757b]">{count}</span>
                                </label>
                              );
                            })}
                          </div>
                          <div className="px-3 py-2 border-t bg-[#fafbfc] flex items-center justify-between" style={{ borderColor: C.gray10 }}>
                            <span className="text-[12px] text-[#72757b]">{selectedTypes.size} selected</span>
                            <button
                              onClick={()=>setTypePopoverOpen(false)}
                              className="px-2.5 h-7 rounded-md bg-[#2e846c] text-white text-[12px] font-medium hover:opacity-90"
                            >Done</button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <ContextSwitcher value={tableView} onChange={setTableView} />
              </div>

              {/* Status cards — counts recompute from the active filter set */}
              <div className="px-6 mt-4 flex gap-3 overflow-x-auto scroll-hide">
                {statusBar.map(s => (
                  <StatCard
                    key={s.id}
                    s={s}
                    active={statusFilter === s.id}
                    onClick={() => setStatusFilter(p => p===s.id ? null : s.id)}
                  />
                ))}
              </div>

              {/* Filter-line (kept padded to align with the rest of the page) */}
              {(statusFilter || (activeView && activeView !== 'all') || activeType || activeChip || search.trim()) && (
                <div className="px-6 mt-4 mb-2 text-[12px] text-[#72757b]">
                  Showing <span className="font-medium text-[#1c212b]">{filtered.length}</span> of {ROWS.length} obligations
                  {statusFilter && <> · filtered by <button onClick={()=>setStatusFilter(null)} className="text-[#2e846c] hover:underline">{STATUS_BAR_DEFS.find(s=>s.id===statusFilter)?.label}</button></>}
                  {activeView && activeView !== 'all' && <> · view <span className="font-medium text-[#1c212b]">{VIEWS.find(v=>v.id===activeView)?.label}</span></>}
                  {activeType && <> · type <span className="font-medium text-[#1c212b]">{TYPES.find(t=>t.id===activeType)?.label}</span></>}
                  {activeChip && <> · chip <button onClick={()=>setActiveChip(null)} className="text-[#2e846c] hover:underline">{activeChip}</button></>}
                </div>
              )}

              {/* Table — flush to the edges. The table scroller and the
                  document preview are flex siblings so the preview PUSHES the
                  table left instead of overlaying it. */}
              <div className="mt-4 pb-0 flex-1 relative flex flex-row overflow-hidden">
                <div ref={tableScrollerRef} className="flex-1 min-w-0 overflow-auto">
                  <ObligationsTable
                    rows={filtered}
                    sort={sort}
                    onSort={onSort}
                    selected={selected}
                    onToggleRow={onToggleRow}
                    onRowClick={setOpenRow}
                    colWidths={colWidths}
                    onResizeStart={onResizeStart}
                    orderedCols={orderedCols}
                    columnPickerOpen={columnPickerOpen}
                    setColumnPickerOpen={setColumnPickerOpen}
                    columnPickerBtnRef={columnPickerBtnRef}
                    columnPickerRef={columnPickerRef}
                    manualCols={manualCols}
                    toggleCol={toggleCol}
                    toggleSection={toggleSection}
                    tableView={tableView}
                    onCellClick={onCellClick}
                    activeCell={
                      sourceCell
                        ? { rowN: sourceCell.row.n, colId: sourceCell.col.id }
                        : (docPreview ? { rowN: docPreview.row.n, colId: docPreview.col.id } : null)
                    }
                    onEarClick={onEarClick}
                    earMenuCell={earMenu ? { rowN: earMenu.row.n, colId: earMenu.col.id } : null}
                  />
                </div>
                <SourcePopover
                  anchorRect={sourceCell?.rect}
                  row={sourceCell?.row}
                  col={sourceCell?.col}
                  onClose={closeSource}
                  onViewInDoc={onViewInDoc}
                  initialMode={sourceCell?.mode || 'view'}
                />
                <CellActionMenu
                  anchorRect={earMenu?.rect}
                  onClose={closeEarMenu}
                  onAction={onEarAction}
                />
                {docPreview && <DocumentPreview payload={docPreview} onClose={closeDoc} onWidthChange={onPreviewWidthChange} />}
              </div>
            </main>
          </div>
          <DetailDrawer row={openRow} onClose={()=>setOpenRow(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
