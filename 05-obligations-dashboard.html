    tr.data-row > td.data-cell { position: relative; }

      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);

    function EditField({ col, value, onChange }) {
      const def = EDIT_FIELDS[col.id] || { kind:'text' };
      const cls = 'w-full h-9 px-3 rounded-lg border bg-white text-[14px] text-[#1c212b] outline-none focus:border-[#2e846c]';
      const style = { borderColor: '#e2e2e8' };
      if (def.kind === 'readonly') return (
        <input className={cls + ' bg-[#f5f6f8] text-[#43474f]'} value={value} disabled style={style} />
      );
      if (def.kind === 'textarea') return (
        <textarea
          className={cls + ' h-24 py-2 resize-none'}
          value={value}
          onChange={e=>onChange(e.target.value)}
          placeholder={def.placeholder}
          style={style}
        />
      );
      if (def.kind === 'select') {
        const opts = typeof def.options === 'function' ? def.options() : def.options;
        return (
          <select className={cls + ' appearance-none pr-8'} value={value || ''} onChange={e=>onChange(e.target.value)} style={style}>
            {!opts.includes(value) && <option value={value}>{value}</option>}
            {opts.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        );
      }
      if (def.kind === 'number' || def.kind === 'percent') return (
        <input type="number" className={cls} value={value || ''} onChange={e=>onChange(e.target.value)} style={style} />
      );
      if (def.kind === 'currency') return (
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[#72757b] text-[14px]">$</span>
          <input type="text" className={cls + ' pl-7'} value={String(value || '').replace(/^\$/, '')} onChange={e=>onChange('$' + e.target.value)} style={style} />
        </div>
      );
      if (def.kind === 'date') return (
        <input type="text" className={cls} value={value || ''} onChange={e=>onChange(e.target.value)} placeholder="e.g., Apr 4, 2026" style={style} />
      );
      if (def.kind === 'progress') return (
        <input type="text" className={cls} value={value || ''} onChange={e=>onChange(e.target.value)} placeholder="e.g., 3/12" style={style} />
      );
      return (
        <input type="text" className={cls} value={value || ''} onChange={e=>onChange(e.target.value)} placeholder={def.placeholder} style={style} />
      );
    }

    function CellActionMenu({ anchorRect, onClose, onAction }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!anchorRect) return;
        const onDoc = (e) => {
          if (ref.current && ref.current.contains(e.target)) return;
          onClose();
        };
        const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
        const t = setTimeout(() => {
          document.addEventListener('mousedown', onDoc);
          document.addEventListener('keydown', onEsc);
        }, 0);
        return () => {
          clearTimeout(t);
          document.removeEventListener('mousedown', onDoc);
          document.removeEventListener('keydown', onEsc);
        };
      }, [anchorRect, onClose]);
      if (!anchorRect) return null;

      const W = 232;
      let top = anchorRect.bottom + 4;
      let left = anchorRect.right - W;
      const vw = window.innerWidth, vh = window.innerHeight;
      if (left + W > vw - 12) left = Math.max(12, vw - W - 12);
      if (left < 12) left = 12;
      const estH = 188;
      if (top + estH > vh - 12) top = Math.max(12, anchorRect.top - estH - 4);

      const items = [
        { id:'copy',   label:'Copy',                 icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="4.5" y="2.5" width="8" height="9" rx="1.2" stroke="#1c212b" strokeWidth="1.3"/><rect x="2.5" y="4.5" width="8" height="9" rx="1.2" stroke="#1c212b" strokeWidth="1.3"/></svg> },
        { id:'edit',   label:'Edit',                 icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 13.5l3-.8L13 5.2l-2.2-2.2L3.3 10.5l-.8 3z" stroke="#1c212b" strokeWidth="1.3" strokeLinejoin="round"/></svg> },
        { id:'accept', label:'Accept flagged values',icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="#1c212b" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg> },
        { id:'delete', label:'Delete',               icon: <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 4.5h10M6.5 4V3a1 1 0 011-1h1a1 1 0 011 1v1M5 4.5l.7 8.5a1.2 1.2 0 001.2 1.1h2.2a1.2 1.2 0 001.2-1.1L11 4.5" stroke="#1c212b" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg> },
      ];

      return (
        <div
          ref={ref}
          className="fixed z-50 bg-white rounded-[8px] p-1 flex flex-col"
          style={{ top, left, width: W, boxShadow: '0 4px 16px rgba(28,33,43,0.18)' }}
        >
          {items.map(it => (
            <button
              key={it.id}
              onClick={()=>{ onAction && onAction(it.id); onClose(); }}
              className="flex items-center gap-2.5 px-3 h-9 rounded-[6px] hover:bg-[#f5f6f8] text-left"
            >
              <span className="shrink-0">{it.icon}</span>
              <span className="text-[14px] text-[#1c212b]">{it.label}</span>
            </button>
          ))}
        </div>
      );
    }

        setDraft(String(rawCellValue(row || {}, col?.id) ?? ''));
        setPreventAI(false);
      }, [row?.n, col?.id, initialMode]);

      useEffect(() => {
        if (!anchorRect) return;
        const onDoc = (e) => {
          if (ref.current && ref.current.contains(e.target)) return;
          onClose();
        };
        const onEsc = (e) => { if (e.key === 'Escape') onClose(); };
        const t = setTimeout(() => {
          document.addEventListener('mousedown', onDoc);
          document.addEventListener('keydown', onEsc);
        }, 0);
        return () => {
          clearTimeout(t);
          document.removeEventListener('mousedown', onDoc);
          document.removeEventListener('keydown', onEsc);
        };
      }, [anchorRect, onClose]);

      if (!anchorRect || !row || !col) return null;
      const tpl = SOURCE_TEMPLATES[col.id];
      if (!tpl) return null;
      const data = tpl(row);

      const W = 460;
      let top = anchorRect.bottom + 6;
      let left = anchorRect.left;
      const vw = window.innerWidth, vh = window.innerHeight;
      if (left + W > vw - 12) left = Math.max(12, vw - W - 12);
      const estHeight = mode === 'edit' ? 280 : 340;
      if (top + estHeight > vh - 12) top = Math.max(12, anchorRect.top - estHeight - 6);

      const cardShell = {
        position: 'fixed', top, left, width: W, zIndex: 40,
        boxShadow: '0 0 24px rgba(67,71,79,0.20)',
      };

      if (mode === 'edit') {
        return (
          <div ref={ref} className="bg-white rounded-[12px] flex flex-col gap-3 p-4" style={cardShell}>
            <div>
              <p className="text-[14px] font-semibold text-[#1c212b] leading-[20px] tracking-[-0.28px]">Edit {col.label.toLowerCase()}</p>
              <p className="text-[14px] text-[#1c212b] leading-[20px] tracking-[-0.28px] mt-1">
                The current value of <span className="font-semibold">"{String(rawCellValue(row, col.id) || '—')}"</span> was set by the Ironclad Intake Agent on {fakeExtractedDate(row)}.
              </p>
            </div>
            <div>
              <div className="text-[12px] font-medium text-[#43474f] mb-1.5">{col.label}</div>
              <EditField col={col} value={draft} onChange={setDraft} />
            </div>
            <label className="flex items-center gap-2 cursor-pointer">
              <input type="checkbox" className="accent-[#2e846c] w-4 h-4" checked={preventAI} onChange={e=>setPreventAI(e.target.checked)} />
              <span className="text-[13px] text-[#1c212b]">Prevent AI from updating this field</span>
            </label>
            <div className="flex gap-2.5 items-center justify-end pt-1">
              <button
                onClick={()=>setMode('view')}
                className="bg-[#f5f6f8] flex items-center justify-center pl-4 pr-3 py-2 rounded-lg hover:bg-[#edeef2]"
              >
                <span className="text-[12px] font-semibold text-[#1c212b] leading-[16px] tracking-[-0.24px] pr-1">Cancel</span>
              </button>
              <button
                onClick={()=>setMode('view')}
                className="bg-white border border-[#1c212b] flex items-center justify-center pl-4 pr-3 py-2 rounded-lg hover:bg-[#f5f6f8]"
              >
                <span className="text-[12px] font-semibold text-[#1c212b] leading-[16px] tracking-[-0.24px] pr-1">Save value</span>
              </button>
            </div>
          </div>
        );
      }

      return (
        <div ref={ref} className="bg-white rounded-[12px] flex flex-col gap-3 p-4" style={cardShell}>
          {/* Title row — column name (matches the column header styling) + close X */}
          <div className="flex items-center justify-between gap-2 -mb-1">
            <span className="text-[11px] font-semibold uppercase tracking-wider text-[#72757b]">{col.label}</span>
            <button
              onClick={onClose}
              className="w-6 h-6 inline-flex items-center justify-center rounded-md text-[#72757b] hover:bg-[#f5f6f8] hover:text-[#1c212b]"
              aria-label="Close"
            >
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 4l6 6M10 4l-6 6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>

          {/* Rationale paragraph */}
          <p className="text-[14px] text-[#1c212b] leading-[20px] tracking-[-0.28px]">{data.rationale}</p>

          {/* Source block — heading is the source DOCUMENT name */}
          <div className="bg-[#f5f6f8] rounded-lg overflow-hidden">
            <div className="px-4 pt-3 pb-2 flex items-center gap-2">
              <p className="text-[14px] font-semibold text-[#43474f] leading-[20px] tracking-[-0.28px] truncate" title={data.doc}>{data.doc}</p>
            </div>
            <div className="px-4 pb-3 flex flex-col gap-2.5">
              <p className="text-[14px] text-[#1c212b] leading-[20px] tracking-[-0.28px]">{data.quote}</p>
              <p className="text-[12px] text-[#43474f] leading-[16px] tracking-[-0.24px]">Extracted by Intake Agent {fakeExtractedDate(row)}</p>
            </div>
            <div className="px-4 pb-4">
              <button
                onClick={()=>onViewInDoc({ row, col, data })}
                className="text-[14px] font-semibold text-[#1c212b] leading-[20px] tracking-[-0.28px] underline underline-offset-2 hover:text-[#2e846c]"
              >
                View in document
              </button>
            </div>
          </div>

          {/* Edit-value CTA only */}
          <div className="flex items-center justify-end">
            <button
              onClick={()=>setMode('edit')}
              className="bg-white border border-[#1c212b] flex items-center justify-center pl-4 pr-3 py-2 rounded-lg hover:bg-[#f5f6f8]"
            >
              <span className="text-[12px] font-semibold text-[#1c212b] leading-[16px] tracking-[-0.24px] pr-1">Edit value</span>
            </button>
          </div>
        </div>
      );
    }

    /* Build a fake multi-section contract body that contains the source quote
     * verbatim, so we can highlight it in the document preview. */
    function makeContractBody(row, quote) {
      const cleanQuote = String(quote).replace(/^"|"$/g, '').replace(/^“|”$/g, '');
      const headers = [
        '1. Definitions',
        '2. Scope of Services',
        '3. Term and Termination',
        '4. Obligations of the Parties',
        '5. Fees and Payment',
        '6. Service Levels',
        '7. Compliance and Security',
        '8. Indemnification',
        '9. Confidentiality',
        '10. General',
      ];
      const filler = (head, n) => {
        const para1 = `The parties acknowledge and agree that the provisions of ${head} shall apply for the duration of this Agreement. Customer shall cooperate in good faith with Vendor's reasonable requests, and Vendor shall provide commercially reasonable support consistent with industry practice.`;
        const para2 = `Notwithstanding anything to the contrary in this Section, ${head.toLowerCase()} shall be construed in accordance with the laws of the State of California, without regard to its conflict-of-laws principles. Any dispute arising hereunder shall be subject to the exclusive jurisdiction of the state and federal courts located in San Francisco County.`;
        const para3 = `Vendor shall provide to Customer such reports, certifications, and documentation as may be reasonably required to evidence compliance with this Section ${n}, no less frequently than once per calendar quarter or as otherwise specified herein. All such reports shall be delivered in machine-readable form via the parties' designated portal.`;
        return [para1, para2, para3];
      };
      // Pick the section that contains the quote based on row.n (deterministic)
      const targetIdx = (row.n % headers.length);
      const sections = headers.map((h, i) => {
        const paras = filler(h, i + 1);
        if (i === targetIdx) {
          // Inject the quote into the middle paragraph
          paras.splice(1, 0, cleanQuote);
        }
        return { head: h, paras };
      });
      return { sections, targetIdx, cleanQuote };
    }

    function DocumentPreview({ payload, onClose, onWidthChange }) {
      const scrollerRef = useRef(null);
      const highlightRef = useRef(null);
      const [mounted, setMounted] = useState(false);
      const [width, setWidth] = useState(640);
      const resizingRef = useRef(null);
      useEffect(() => { if (onWidthChange) onWidthChange(width); }, [width, onWidthChange]);

      useEffect(() => {
        if (!payload) return;
        const raf = requestAnimationFrame(() => setMounted(true));
        return () => cancelAnimationFrame(raf);
      }, [payload]);

      useEffect(() => {
        if (!payload || !mounted) return;
        const t = setTimeout(() => {
          if (highlightRef.current && scrollerRef.current) {
            const el = highlightRef.current;
            const sc = scrollerRef.current;
            const top = el.offsetTop - sc.clientHeight / 3;
            sc.scrollTo({ top, behavior: 'smooth' });
          }
        }, 200);
        return () => clearTimeout(t);
      }, [mounted, payload]);

      const onResizeStart = (e) => {
        e.preventDefault(); e.stopPropagation();
        resizingRef.current = { startX: e.clientX, startW: width };
        const onMove = (ev) => {
          const r = resizingRef.current; if (!r) return;
          // Dragging left = panel grows (right edge is anchored to viewport right)
          const delta = r.startX - ev.clientX;
          const next = Math.min(window.innerWidth * 0.9, Math.max(360, r.startW + delta));
          setWidth(next);
        };
        const onUp = () => {
          resizingRef.current = null;
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
        document.body.style.cursor = 'ew-resize';
        document.body.style.userSelect = 'none';
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
      };

      if (!payload) return null;
      const { row, col, data } = payload;
      const body = makeContractBody(row, data.quote);

      const slideClose = () => {
        setMounted(false);
        setTimeout(onClose, 200);
      };

      return (
        <div
          className="shrink-0 bg-white flex flex-col relative"
          style={{
            width,
            transform: mounted ? 'translateX(0)' : 'translateX(100%)',
            transition: resizingRef.current ? 'none' : 'transform .22s ease-out',
            borderLeft: `1px solid ${C.gray10}`,
            borderTop: `1px solid ${C.gray10}`,
          }}
        >
          {/* Left-edge resize handle */}
          <div
            onMouseDown={onResizeStart}
            title="Drag to resize"
            className="absolute top-0 left-[-4px] h-full w-2 cursor-ew-resize z-40 group"
          >
            <div className="absolute top-1/2 -translate-y-1/2 left-1/2 -translate-x-1/2 w-0.5 h-12 rounded-full bg-transparent group-hover:bg-[#2e846c]" />
          </div>

          {/* Header */}
          <div className="px-5 py-3 border-b flex items-center justify-between" style={{ borderColor: C.gray10 }}>
            <div className="min-w-0">
              <div className="text-[14px] font-semibold text-[#1c212b] truncate">{data.doc}</div>
              <div className="text-[12px] text-[#72757b] mt-0.5">Showing source of <span className="font-medium text-[#1c212b]">{col.label}</span> · Obligation #{row.n}</div>
            </div>
            <button onClick={slideClose} className="text-[#43474f] hover:text-[#1c212b]" aria-label="Close">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/></svg>
            </button>
          </div>

          {/* Document scroller */}
          <div ref={scrollerRef} className="flex-1 overflow-y-auto px-7 py-6 leading-[1.6] text-[14px] text-[#1c212b]" style={{ background:'#fafbfc' }}>
            <div className="mx-auto bg-white rounded-md border p-6" style={{ borderColor: C.gray10, maxWidth: Math.max(380, width - 120) }}>
              <h1 className="font-display text-[18px] font-bold mb-1">{(row.contract || 'Master Services Agreement').toUpperCase()}</h1>
              <div className="text-[12px] text-[#72757b] mb-5">Acme Corporation and {row.cparty || 'Counterparty'} · Executed Mar 14, 2024</div>
              {body.sections.map((sec, idx) => (
                <div key={idx} className="mb-5">
                  <h2 className="font-display text-[14px] font-semibold mb-2">{sec.head}</h2>
                  {sec.paras.map((p, j) => {
                    const isHighlight = (idx === body.targetIdx && p === body.cleanQuote);
                    if (isHighlight) {
                      return (
                        <p
                          key={j}
                          ref={highlightRef}
                          className="mb-3 rounded-md px-2 py-1"
                          style={{ background:'#cfe3ff', boxShadow:'inset 0 0 0 1px #3b83f6' }}
                        >
                          {p}
                        </p>
                      );
                    }
                    return <p key={j} className="mb-3 text-[#43474f]">{p}</p>;
                  })}
                </div>
              ))}
            </div>
          </div>

          {/* Footer */}
          <div className="px-5 py-3 border-t bg-white flex items-center justify-between" style={{ borderColor: C.gray10 }}>
            <span className="text-[12px] text-[#72757b]">Highlighted text is the source of <span className="font-medium text-[#1c212b]">{col.label}</span>.</span>
            <button
              onClick={slideClose}
              className="bg-[#1c212b] text-white px-3 h-8 rounded-md text-[12px] font-semibold hover:opacity-90"
            >
              Done
            </button>
          </div>
        </div>
      );
    }

    function ContextSwitcher({ value, onChange }) {
      const opts = [
        { id:'list', label:'List',
          icon: <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3.5h10M2 7h10M2 10.5h10" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg> },
        { id:'data', label:'Data',
          icon: <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="1.5" width="11" height="11" rx="1" stroke="currentColor" strokeWidth="1.2"/><path d="M5 1.5v11M9 1.5v11M1.5 5h11M1.5 9h11" stroke="currentColor" strokeWidth="1.2"/></svg> },
      ];
      return (
        <div className="inline-flex items-center bg-white rounded-lg p-0.5 border shrink-0 h-12" style={{ borderColor: C.gray10 }}>
          {opts.map(o => (
            <button key={o.id}
              onClick={()=>onChange(o.id)}
              className={`inline-flex items-center gap-1.5 px-3 h-10 rounded-md text-[13px] font-medium ${value===o.id?'bg-[#f5f6f8] text-[#1c212b]':'text-[#43474f] hover:text-[#1c212b]'}`}

    function ViewToggle({ value, onChange }) {
      const opts = [
        { id:'list',      label:'List',      icon:I.list },
        { id:'tree',      label:'Tree',      icon:I.tree },
        { id:'data',      label:'Data',      icon:I.grid },
        { id:'dashboard', label:'Dashboard', icon:I.dashboard },
